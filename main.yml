  tasks:
    - include_vars: vars/rhsm_secrets.yml
      ignore_errors: true
    - include_role:
        name: build_from_iso_centos
      vars:
        # regular linux role 
        vm_hostname: "{{inventory_hostname}}"
        vm_address: "{{ip_address}}"
        vm_name: "{{lab_prefix | default('')}}{{inventory_hostname}}"
        vm_network: "{{lab_lan1_portgroup}}"
        vm_password_new: "{{lab_password}}"
        vm_netmask: "{{lab_lan1_netmask}}"
        vm_netmask_cidr: "{{lab_lan1_netmask_cidr}}"
        vm_gateway: "{{lab_lan1_gateway}}"
        vm_dns_server: "{{lab_lan1_dns_ip}}"
        vm_domain: "{{lab_domain_name}}"
        vm_datastore: "{{lab_vm_datastore}}"
        # vm_username: 'root'
        vm_password: '{{lab_password}}'
        # AIQUM defaults:
        distro: "{{linux_distro | default('rocky') }}"
        version: "{{linux_version | default('9.4') }}"
        vm_memory_mb: 16384
        vm_num_cpus: 4
        vm_disk_gb: 200
        install_xrdp: true
        extra_files:
          - "{{ install_file | default('') }}"
        extra_commands:
          # copy the install from the cdrom
          - "mkdir /mnt/cdrom"
          - "mount /dev/sr1 /mnt/cdrom"
          - "cp /mnt/cdrom/files/* /home/admin/"
          - "umount /mnt/cdrom"
          - "rm -rf /mnt/cdrom"
          - unzip /home/admin/ActiveIQUnifiedManager-*.zip -d /home/admin
          - dnf install -y epel-release
          - wget  http://repo.mysql.com/yum/mysql-8.4-community/el/8/x86_64/mysql84-community-release-el8-1.noarch.rpm
          - dnf install -y mysql84-community-release-el8-1.noarch.rpm
          - /home/admin/pre_install_check.sh
          - "dnf install -y /home/admin/*.rpm"
          # HTTP which redirects to 443
          - firewall-cmd --permanent --add-port=80/tcp
          # HTTPS for Web UI
          - firewall-cmd --permanent --add-port=443/tcp
          # Maintenance over ssh/sftp
          - firewall-cmd --permanent --add-port=22/tcp
          # MySQL connectivity for WFA
          - firewall-cmd --permanent --add-port=3306/tcp
          # Syslog for EMS messages
          - firewall-cmd --permanent --add-port=514/tcp
          # REST API
          - firewall-cmd --permanent --add-port=9443/tcp
          # AMQP QPID Broker
          - firewall-cmd --permanent --add-port=56072/tcp
          # AMQP QPID Broker WebSocket
          - firewall-cmd --permanent --add-port=56080/tcp
          - firewall-cmd --permanent --add-port=56443/tcp
          - firewall-cmd --reload
      when: 
        - install_file|default('') != ''

- name: Deploy OVF files
  hosts: ovf
  gather_facts: false
  vars_files:
    - defaults/main.yml
    - "{{ mainvars }}"
    - "{{ credentials }}"
  tasks:
  - vmware_deploy_ovf:
      hostname: '{{ vcenter_address }}'
      username: '{{ vcenter_username }}'
      password: '{{ vcenter_password }}'
      validate_certs: no
      datacenter: '{{ vcenter_datacenter }}'
      cluster: '{{ vcenter_cluster }}'
      datastore: "{{lab_vm_datastore}}"
      name: "{{lab_prefix | default('')}}{{inventory_hostname}}"
      ovf: '{{ ovf_file }}'
      disk_provisioning: thin
      power_on: yes
      wait_for_ip_address: false
      networks: "{{ovf_networks}}"
      inject_ovf_env: true
      properties: "{{ovf_properties}}"
    delegate_to: localhost
    retries: 10
    delay: 60
    register: result
    until: result is succeeded
    when: #only run on VMware
      - pve_address|default('') == ''

# HPE VM Essentials setup, run by stage 2 inside the lab, where the HVM hosts and the ONTAP sim
# are reachable: ONTAP storage, the Manager VM, its first-time setup and the HVM cluster.
# The stage 2 blueprint puts the hosts in group hpevme with these settings (roles/hpevme_setup).
- name: Set up HPE VM Essentials
  hosts: hpevme
  gather_facts: false
  vars_files:
    - defaults/main.yml
    - "{{ mainvars }}"
    - "{{ credentials }}"
  tasks:
    - include_role:
        name: hpevme_setup
      when: state | default('present') != 'absent'

# Stage 2: LabBuilder runs again on the lab's Ansible VM, inside the pod, with a blueprint and vars
# file generated for the lab's own vCenter (roles/stage2). The gateway forwards stage2_ssh_port to it.
- name: Stage 2 inside the pod
  hosts: stage2
  gather_facts: false
  vars_files:
    - defaults/main.yml
    - "{{ mainvars }}"
    - "{{ credentials }}"
  tasks:
    - include_role:
        name: stage2
      when: state | default('present') != 'absent'
      vars:
        stage2_gateway_vm: "{{lab_prefix | default('')}}gateway"
        stage2_lan_gateway: "{{lab_lan1_gateway}}"
        stage2_vm_name: "{{lab_prefix | default('')}}{{inventory_hostname}}"
