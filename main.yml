# This play takes all the name/ip pairs from all hosts and adds DNS records on the DC
- name: populate DNS records
  hosts: all
  serial: 1
  gather_facts: false
  vars_files:
    - defaults/main.yml
    - "{{ mainvars }}"
    - "{{ credentials }}"
  tasks:
  # Once, for the PTR records below. WIN32 9609: the zone exists, which is fine.
  # (exit 0: powershell -command exits 1 after any error, even a handled one)
  # Retried: right after the DC is promoted, AD-integrated DNS may not take a new zone yet.
  - name: Add the reverse lookup zone via vm shell
    community.vmware.vmware_vm_shell:
      hostname: '{{ vcenter_address }}'
      username: '{{ vcenter_username }}'
      password: '{{ vcenter_password }}'
      validate_certs: no
      vm_username: ".\\Administrator"
      vm_password: "{{lab_password}}"
      vm_id: "{{lab_prefix | default('')}}{{lab_domain_controller}}"
      vm_shell: 'c:\windows\system32\windowspowershell\v1.0\powershell.exe'
      vm_shell_args: >-
        -command "try { Add-DnsServerPrimaryZone -NetworkId {{ (lab_lan1_gateway ~ '/' ~ lab_lan1_netmask_cidr) | ansible.utils.ipaddr('network/prefix') }} -ReplicationScope Domain -ErrorAction Stop }
        catch { if ($_.FullyQualifiedErrorId -notmatch 'WIN32 9609') { throw } }; exit 0"
      wait_for_process: true
    delegate_to: localhost
    retries: 10
    delay: 30
    register: zone_result
    until: zone_result is succeeded
    ignore_errors: yes
    when:
      - lab_domain_controller|default("") != ""
      - inventory_hostname == ansible_play_hosts_all[0]

  # Once: send outside lookups to the lab gateway's resolver. Recursing from root hints, the
  # DC's DNS returns SERVFAIL for some names (galaxy.ansible.com, github.com) that the gateway
  # resolves, which broke stage 2's collection install.
  - name: Forward the DC's outside lookups to the lab gateway via vm shell
    community.vmware.vmware_vm_shell:
      hostname: '{{ vcenter_address }}'
      username: '{{ vcenter_username }}'
      password: '{{ vcenter_password }}'
      validate_certs: no
      vm_username: ".\\Administrator"
      vm_password: "{{lab_password}}"
      vm_id: "{{lab_prefix | default('')}}{{lab_domain_controller}}"
      vm_shell: 'c:\windows\system32\windowspowershell\v1.0\powershell.exe'
      vm_shell_args: >-
        -command "Set-DnsServerForwarder -IPAddress {{ lab_lan1_gateway }} -UseRootHint $true -ErrorAction Stop; Clear-DnsServerCache -Force"
      wait_for_process: true
    delegate_to: localhost
    retries: 5
    delay: 30
    register: forwarder_result
    until: forwarder_result is succeeded
    ignore_errors: yes
    when:
      - lab_domain_controller|default("") != ""
      - inventory_hostname == ansible_play_hosts_all[0]

  # A and PTR records. The A record is replaced, so a rerun also adds a missing PTR.
  # WIN32 9715: the A record was added but the PTR exists, which is fine.
  - name: Add DNS record via vm shell
    community.vmware.vmware_vm_shell:
      hostname: '{{ vcenter_address }}'
      username: '{{ vcenter_username }}'
      password: '{{ vcenter_password }}'
      validate_certs: no
      vm_username: ".\\Administrator"
      vm_password: "{{lab_password}}"
      vm_id: "{{lab_prefix | default('')}}{{lab_domain_controller}}"
      vm_shell: 'c:\windows\system32\windowspowershell\v1.0\powershell.exe'
      vm_shell_args: >-
        -command "Remove-DnsServerResourceRecord -ZoneName {{lab_domain_name}} -RRType A -Name {{ item.name }} -Force -ErrorAction SilentlyContinue;
        try { Add-DnsServerResourceRecordA -Name {{ item.name }} -ZoneName {{lab_domain_name}} -AllowUpdateAny -IPv4Address {{ item.ip }} -CreatePtr -TimeToLive 01:00:00 -ErrorAction Stop }
        catch { if ($_.FullyQualifiedErrorId -notmatch 'WIN32 9715') { throw } }; exit 0"
      wait_for_process: true
    delegate_to: localhost
    retries: 3
    delay: 10
    register: result
    until: result is succeeded
    ignore_errors: yes
    # this host, plus optional records for machines that aren't inventory hosts, e.g. a VM nested
    # on this host: extra_dns_records: [ { name: vme, ip: 192.168.0.30 } ]
    loop: "{{ [{'name': inventory_hostname, 'ip': ip_address}] + extra_dns_records | default([]) }}"
    loop_control:
      label: "{{ item.name }} {{ item.ip }}"
    when: lab_domain_controller|default("") != "" and ip_address is defined

# Nutanix runs before the Windows servers: it writes the lab guide that a
# Windows VM can pick up through extra_files (see inventories/lab_nutanix.yml)
- name: Build Nutanix CE nodes
  hosts: nutanix
  gather_facts: false
  vars_files:
    - defaults/main.yml
    - "{{ mainvars }}"
    - "{{ credentials }}"
  roles:
    - role: build_from_iso_nutanix
      vars:
        vm_name:      "{{lab_prefix | default('')}}{{inventory_hostname}}"
        vm_hostname:  "{{inventory_hostname}}"
        vm_network:   "{{lab_lan1_portgroup}}"
        vm_datastore: "{{lab_vm_datastore}}"
        host_address: "{{ip_address}}"
        vm_netmask:   "{{lab_lan1_netmask}}"
        vm_gateway:   "{{lab_lan1_gateway}}"

- name: Create Nutanix CE cluster
  hosts: nutanix
  gather_facts: false
  vars_files:
    - defaults/main.yml
    - "{{ mainvars }}"
    - "{{ credentials }}"
  tasks:
    - include_role:
        name: build_from_iso_nutanix
        tasks_from: create_cluster.yml
      run_once: true
      when: state|default('present') != 'absent'
      vars:
        vm_gateway:             "{{lab_lan1_gateway}}"
        nutanix_gateway_vm:     "{{lab_prefix | default('')}}gateway"
        nutanix_dns_servers:    "{{lab_lan1_dns_ip}}"
        nutanix_ntp_servers:    "{{lab_lan1_gateway}}"
        nutanix_admin_password: "{{lab_password}}"
        nutanix_lab_domain:     "{{lab_domain_name}}"
        nutanix_lan_prefix_len: "{{lab_lan1_netmask_cidr}}"

# Prepare a freshly deployed vCenter: datacenter, cluster, ESXi hosts, datastore, installer ISOs
# (roles/vsphere_prep). Used by stage 2 blueprints, which run inside a lab against its own vCenter.
# Reads vcenter_* and esxi_* from mainvars; the ISOs to upload are `isos` (host var or -e).
# Before the Windows servers, so a stage 2 blueprint can build Windows VMs in that vCenter.
- name: Prepare vSphere
  hosts: vsphere_prep
  gather_facts: false
  vars_files:
    - defaults/main.yml
    - "{{ mainvars }}"
    - "{{ credentials }}"
  tasks:
    - include_role:
        name: vsphere_prep
      when: state | default('present') != 'absent'

