## ==============================================================
## This configuration file defines the virtualization environment
## which will host lab VMs constructed by labbuilder.
## ==============================================================

## For vCenter managed VMware environments complete this section
## ---------------------------------------------------------------
vcenter_address: vc1.lab.madlabber.com
vcenter_username: administrator@vsphere.local
vcenter_password: P@ssw0rd
vcenter_datacenter: 'Datacenter'
vcenter_cluster: "hlod"
cluster_hosts:
  - esx48.lab.madlabber.com
# - esx49.lab.madlabber.com  

## For all VMware based environments, complete this section 
## -------------------------------------------------------------
## Designate a primary host for provisioning and delegation:
## If this host is managed by vcenter the hostname must match the inventory name
esxi_hostname: "esx48.lab.madlabber.com"
esxi_address: 192.168.123.48
esxi_username: root
esxi_password: P@ssw0rd

## Default datastore for new VMs
vm_datastore: "AdminVMs"

## Default datastore for ISO files
iso_datastore: "ISOs"

## Default vswitch for new portgroups
esxi_vswitch: "vSwitch1"

## Default network for new VMs
vm_network: "VM Network"

## VLAN Pool for building lab pod portgroups
vlan_start: 1000
vlan_count: 1000

## For Proxmox environments, complete this section:
## --------------------------------------------------------------
## This section defines the proxmox node for provisioning operations:
# pve_node: pve51
# pve_address: 192.168.123.51
# pve_username: root
# pve_password: P@ssw0rd

## Default storage for new VMs:
# vm_datastore: "local-lvm"

## Default datastore for ISO files:
# iso_datastore: "local"
# iso_path: /var/lib/vz/template/iso

## Default bridge for new VMs
# vm_network: "vmbr0"

## VLAN Pool for building lab pod portgroups
# vlan_start: 1000
# vlan_count: 1000

## This table maps portgroup names to proxmox bridge and vlan
# pve_networks:
#     "vmbr0":             { "bridge": "vmbr0" }
#     "vmbr1":             { "bridge": "vmbr1" }
#     "VM Network":        { "bridge": "vmbr0" }
#     "lab_test_net1":     { "bridge": "vmbr1", "vlan": 1001 }
#     "lab_test_net2":     { "bridge": "vmbr1", "vlan": 1002 }   

## This table maps lab datastores to proxmox datastores
# pve_datastores:
#   "lab_test2":       'local-lvm1'
#   "lab_vlan126":     'local-lvm1'
#   "lab_ansible_v2a": 'local-lvm1'
#   "lab_proxmox84":   'local-lvm1'

## -------------------------------------------------
## This section defines the storage environment
## Only define this section is the back end storage
## is a NetApp ONTAP based system
## -------------------------------------------------
## ONTAP vars required to build lab datastores
ontap_address: "192.168.123.10"
ontap_password: "P@ssw0rd"
ontap_svm_name: "svm33"
ontap_svm_address: "192.168.122.33"
ontap_svm_lif: "svm33_nfs_33"
ontap_vol_labs: "Labs"
ontap_vol_size_gb: 500
ontap_aggregate: "ots10_01_SSD_1"
