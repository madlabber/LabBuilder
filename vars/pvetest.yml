# Configuration Variables for Proxmox Environments

# In the current implementation deployments
# target a specific proxmox node defined below:
pve_node: pve51
pve_address: 192.168.123.51
pve_username: root
pve_password: P@ssw0rd

# Default storage location for new VMs
vm_datastore: "Local-LVM"

# Default iso location
# iso_datastore: local
# iso_path: /var/lib/vz/template/iso
iso_datastore: ISOs
iso_path: /mnt/pve/ISOs

# Default import location
import_datastore: local
import_path: /var/lib/vz/import

# Default portgroup for new VMs
vm_network: "vmbr0"

# This section is not currently implementated:
# VLAN Pool for building lab pod portgroups
# vlan_start: 1000
# vlan_count: 1000

# ONTAP vars required to build lab pod datastores
ontap_address: "192.168.123.10"
ontap_password: "P@ssw0rd"
ontap_svm_name: "svm33"
ontap_svm_address: "192.168.122.33"
ontap_svm_lif: "svm33_nfs_33"
ontap_vol_labs: "Labs"
ontap_vol_size_gb: 500
ontap_aggregate: "ots10_01_SSD_1"

# Network substitutions
# PVE has a very short limit on bridge names
# This table maps VMW portgroup names to corresponding linux bridge names
network_substitutions: {
  'vm_network'    : 'vmbr0',
  'VM Network' : 'vmbr0',
  'Cluster Network' : 'vmbr1',
  'lab_test_net1' : 'vmbr1',
  'lab_test_net2' : 'vmbr1',
  'VLAN126'       : 'vlan126',
  'lab_proxmox84_net1' : 'vmbr1',
  'lab_proxmox84_net2' : 'vmbr1',
  'lab_ansible_v2a_net1' : 'vmbr1',
  'lab_vlan126_net2' : 'vmbr2126',
  'VLAN121' : 'vlan121',
  'lab_pvetest_net1' : 'vmbr1',
  'lab_pvetest_net2' : 'vmbr1'
}

network_vlan_table: {
  'lab_pvetest_net1' : 1001
}

# This table maps lab datastores to proxmox datastores
pve_datastores:
  "lab_test2":       'local-lvm1'
  "lab_vlan126":     'local-lvm1'
  "lab_ansible_v2a": 'local-lvm1'
  "lab_proxmox84":   'local-lvm1'

# This table maps portgroup names to proxmox bridge and vlan
pve_networks:
    "vmbr0":             { "bridge": "vmbr0" }
    "vmbr1":             { "bridge": "vmbr1" }
    "VM Network":        { "bridge": "vmbr0" }
    "VLAN121":           { "bridge": "vlan121" }
    "VLAN126":           { "bridge": "vlan126" }
    "lab_vlan126_net2":  { "bridge": "vmbr0", "vlan": 2126 }
    "Cluster Network":   { "bridge": "vmbr1" }
    "lab_pvetest_net1":  { "bridge": "vmbr1", "vlan": 1001 }
    "lab_pvetest_net2":  { "bridge": "vmbr1", "vlan": 1002 }

