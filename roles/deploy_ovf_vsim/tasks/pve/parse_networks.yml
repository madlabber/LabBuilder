
- name: Add Network Adapters
  set_fact:
    networks:
      net0: "e1000,bridge={{ pve_networks[ethernet_ports.e0a|default(cluster_network)].bridge }}{{ (pve_networks[ethernet_ports.e0a|default(cluster_network)].vlan is defined) | ternary(',tag=' ~ (pve_networks[ethernet_ports.e0a|default(cluster_network)].vlan | default('')), '') }}"
      net1: "e1000,bridge={{ pve_networks[ethernet_ports.e0b|default(cluster_network)].bridge }}{{ (pve_networks[ethernet_ports.e0b|default(cluster_network)].vlan is defined) | ternary(',tag=' ~ (pve_networks[ethernet_ports.e0b|default(cluster_network)].vlan | default('')), '') }}"
      net2: "e1000,bridge={{ pve_networks[ethernet_ports.e0c|default(data_network)].bridge }}{{ (pve_networks[ethernet_ports.e0c|default(data_network)].vlan is defined) | ternary(',tag=' ~ (pve_networks[ethernet_ports.e0c|default(data_network)].vlan | default('')), '') }}"
      net3: "e1000,bridge={{ pve_networks[ethernet_ports.e0d|default(data_network)].bridge }}{{ (pve_networks[ethernet_ports.e0d|default(data_network)].vlan is defined) | ternary(',tag=' ~ (pve_networks[ethernet_ports.e0d|default(data_network)].vlan | default('')), '') }}"
  when: vm_num_nics|int <= 4

