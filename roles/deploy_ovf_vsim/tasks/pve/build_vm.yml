- name: Configure the last nic for HA traffic
  community.general.proxmox_nic:
    api_user: '{{ pve_username }}@pam'
    api_password: '{{ pve_password }}'
    api_host: '{{ pve_address }}'
    validate_certs: false
    vmid: "{{ create_vm.vmid }}"
    interface: "net{{vm_num_nics|int -1}}"
    model: "e1000"
    mac: "{{node1_icmac}}"
    bridge: "{{ pve_networks[ethernet_ports.e0a|default(cluster_network)].bridge }}"
    tag:    "{{ pve_networks[ethernet_ports.e0a|default(cluster_network)].vlan|default(omit)}}"
  delegate_to: localhost
  register: set_ic_mac
  retries: 3
  delay: 10
  until: set_ic_mac is succeeded
  when: loop_vm_name == node1_name

- name: Configure the last nic for HA traffic
  community.general.proxmox_nic:
    api_user: '{{ pve_username }}@pam'
    api_password: '{{ pve_password }}'
    api_host: '{{ pve_address }}'
    validate_certs: false
    vmid: "{{ create_vm.vmid }}"
    interface: "net{{vm_num_nics|int -1}}"
    model: "e1000"
    mac: "{{node2_icmac}}"
    bridge: "{{ pve_networks[ethernet_ports.e0a|default(cluster_network)].bridge }}"
    tag:    "{{ pve_networks[ethernet_ports.e0a|default(cluster_network)].vlan|default(omit)}}"
  delegate_to: localhost
  register: set_ic_mac
  retries: 3
