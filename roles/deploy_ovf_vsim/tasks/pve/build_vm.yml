- name: Import and Attach disks
  shell:  
    cmd: "qm set {{ create_vm.vmid }} --ide{{item}} {{ pve_datastore }}:0,import-from={{ import_path }}/{{ loop_vm_name }}-disk{{item+1}}.vmdk"
  delegate_to: temp_host
  when: item != 3 or disk_model == "vha"
  loop:
   - 0
   - 1
   - 2
   - 3

- name: Remove disks from temporary storage
  ansible.builtin.file:
    path: "{{ import_path }}/{{ loop_vm_name }}-{{item}}.vmdk"
    state: absent
  delegate_to: temp_host
  when: item != 'disk4' or disk_model == "vha"
  loop:
    - disk1
    - disk2
    - disk3
    - disk4

