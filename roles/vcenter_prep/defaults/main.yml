---
# Prepares a freshly deployed vCenter: datacenter, cluster, ESXi hosts, a datastore, installer ISOs.
# Run where the vCenter and its hosts are reachable directly, e.g. inside a lab (stage 2).
vcenter_prep_address: ""
vcenter_prep_username: "administrator@vsphere.local"
vcenter_prep_password: ""
vcenter_prep_wait: 5400                 # seconds to wait for a vCenter that is still in its first boot

vcenter_prep_datacenter: "Datacenter"
vcenter_prep_cluster: "Cluster"
vcenter_prep_esx_hosts: []              # FQDNs of the ESXi hosts to add
vcenter_prep_esx_username: root
vcenter_prep_esx_password: ""

# The first host gets this datastore on its largest empty disk if it has none. ESXi 8 keeps its
# boot disk for itself, so give the host a separate data disk.
vcenter_prep_datastore: "datastore1"

# Installer ISOs (files in files/) uploaded to [datastore] ISO/
vcenter_prep_isos: []
