---
# Stage 2: LabBuilder runs a second time on the lab's Ansible VM, inside the pod, where the lab's
# own vCenter and ESXi hosts are reachable. The runner is reached through the lab gateway, which
# forwards stage2_ssh_port on its WAN address to the runner's port 22 (see nat_rules).
stage2_gateway_vm: "gateway"            # lab gateway VM (outer vCenter)
stage2_lan_gateway: ""                  # lab LAN gateway address (tells LAN from WAN)
stage2_vm_name: ""                      # the runner VM's name in the outer vCenter
stage2_ssh_port: 2223
stage2_ssh_key: "~/.ssh/labbuilder_stage2"   # made on first use; only this key gets into the pod
stage2_dir: "/root/LabBuilder"          # LabBuilder's copy on the runner
stage2_venv: "/root/venv-labbuilder"    # Python 3.12 venv with ansible-core, pyVmomi and the VMware collections
stage2_ansible_core: ">=2.17,<2.21"     # versions the VMware collections support (LabBuilder runs 2.20)
stage2_community_vmware: ">=6.4.0,<7.0.0"   # 7.0.0 removed modules LabBuilder's roles use (vmware_guest_powerstate)
stage2_wait: 7200                       # seconds to wait for the stage 2 run

# What stage 2 does (generated into its blueprint and vars file)
stage2_vcenter: ""                      # inventory name of the lab's vCenter (its ip_address is used)
stage2_datacenter: "Datacenter"
stage2_cluster: "Cluster"
stage2_esx_hosts: []                    # inventory names of the lab's ESXi hosts
stage2_datastore: "datastore1"          # created on the first host's data disk
stage2_network: "VM Network"
stage2_isos: []                         # files in files/ uploaded to [datastore] ISO/
stage2_ovas: []                         # e.g. [ { name: move, ova: Nutanix-Move.ova, fix_ovf: true } ], deployed by "Deploy OVF files"
                                        # fix_ovf: unpack the OVA and put its OVF in the order vCenter's import requires
stage2_files: []                        # other files in files/ that stage 2 needs on the runner (not uploaded to the datastore)
stage2_groups: {}                       # more inventory groups for the stage 2 blueprint, as {group: {hosts: ..., vars: ...}};
                                        # tag values Ansible must not fill in outside the lab with !unsafe
stage2_pip_extra: []                    # more Python packages for the runner's venv
stage2_collections_extra: []            # more collections for the runner
