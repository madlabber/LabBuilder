- name: set vmw vars
  set_fact:
    host_type: "vmw"
  when:
    - vcenter_address ~ esxi_address != ''

- name: set pve vars
  set_fact:
    host_type: "pve"
    pve_vm_datastore: "{{ pve_datastores[vm_datastore]|default(vm_datastore) }}"
  when:
    - pve_address != ''    

- name: map disk1 vars from nestedesx 
  set_fact:
    disks:
      - size_gb: '{{ vm_disk1_size_gb }}'
        controller_type: '{{ disk_controller }}'
        controller_number: 0
        unit_number: 0
        type: thin
  when: vm_disk1_size_gb|default(0) > 0

- name: map disk2 vars from nestedesx 
  set_fact:
    disks:
      - size_gb: '{{ vm_disk1_size_gb }}'
        controller_type: '{{ disk_controller }}'
        controller_number: 0
        unit_number: 0
        type: thin
      - size_gb: '{{ vm_disk2_size_gb }}'
        controller_type: '{{ disk_controller }}'
        controller_number: 0
        unit_number: 1
        type: thin
  when: 
    - vm_disk1_size_gb|default(0) > 0
    - vm_disk2_size_gb|default(0) > 0

  # Parse host specific vars
- name: Process vars
  include_tasks: "{{host_type}}/parse_vars.yml"