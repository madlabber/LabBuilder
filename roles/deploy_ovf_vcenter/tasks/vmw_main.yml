---
# When the target is a vcenter server, some parameters are not user configurable
# So in this scenario the user configurable vars are set during deploy_ovf
# And the remaining vars are set with vmware_guest

# This is a little underhanded, but the default 10 second timeout is very risky for the vcenter ova
- name: Locate system community.vmware vmware_deploy_ovf.py path
  ansible.builtin.command: >
    python3 -c "import ansible_collections.community.vmware.plugins.modules.vmware_deploy_ovf as m; print(m.__file__)"
  register: deploy_ovf_module_path
  changed_when: false
  delegate_to: localhost

- name: Ensure local playbook library directory exists
  ansible.builtin.file:
    path: "{{ playbook_dir }}/library"
    state: directory
    mode: "0755"
  delegate_to: localhost

- name: Copy vmware_deploy_ovf.py to local library directory
  ansible.builtin.copy:
    src: "{{ deploy_ovf_module_path.stdout | trim }}"
    dest: "{{ playbook_dir }}/library/vmware_deploy_ovf.py"
    remote_src: true
    force: false
    mode: "0644"
  delegate_to: localhost

- name: Ensure open_url in local vmware_deploy_ovf.py uses a 600s socket timeout
  ansible.builtin.replace:
    path: "{{ playbook_dir }}/library/vmware_deploy_ovf.py"
    regexp: '(open_url\([^,\n]+,\s*)(?![^)]*timeout=)'
    replace: '\1timeout=600, '
  delegate_to: localhost


- community.vmware.vmware_deploy_ovf:
    hostname: '{{ vcenter_address }}'
    username: '{{ vcenter_username }}'
    password: '{{ vcenter_password }}'
    validate_certs: no      
    datacenter: '{{ vcenter_datacenter }}'
    cluster: '{{ vcenter_cluster }}'
    datastore: '{{ vm_datastore }}'
    name: '{{ vm_name }}' # shortname, not FQDN
    ovf: '{{ ovf_file }}' 
    disk_provisioning: thin
    networks:
        "Network 1": "{{vm_network}}"
    power_on: no
    wait_for_ip_address: false
    inject_ovf_env: true
    enable_hidden_properties: true
    deployment_option: '{{ deployment_option }}' # vCenter t-shirt size: tiny,small,medium,large, or infrastructure 
    properties:
      #DeploymentOption.value: '{{deployment_option}}' # vCenter t-shirt size: tiny,small,medium,large, or infrastructure 
      guestinfo.cis.appliance.net.addr.family: 'ipv4' # ipv4 or ipv6
      guestinfo.cis.appliance.net.mode: '{{vm_net_mode}}' # static or dhcp
      guestinfo.cis.appliance.net.addr: '{{ vm_address }}' 
      guestinfo.cis.appliance.net.pnid: "{{ vm_fqdn | default(vm_address) }}" # FQDN of vcenter server
      guestinfo.cis.appliance.net.prefix: '{{ vm_netmask_cidr }}' # netmask length, CIDR notation, i.e. '24'
      guestinfo.cis.appliance.net.gateway: '{{ vm_gateway }}' 
      guestinfo.cis.appliance.net.dns.servers: '{{ vm_dns_server }}' # Comma separated list of IP addresses of DNS servers.
      guestinfo.cis.appliance.root.passwd: '{{ vm_password }}' 
      guestinfo.cis.deployment.autoconfig: '{{vm_autoconfig|string}}' # Auto-configure after deployment
      guestinfo.cis.vmdir.password: '{{ vm_password }}' # SSO Password for administrator@vsphere.local
      guestinfo.cis.appliance.ssh.enabled: '{{vm_enable_ssh|string}}'
#      guestinfo.cis.upgrade.import.directory: "/storage/seat/cis-export-folder" #FIX for VCSA 8.0
      domain: '{{ vm_domain }}'
      searchpath: '{{ searchpath }}'
  retries: 3
  delay: 45
  delegate_to: localhost

