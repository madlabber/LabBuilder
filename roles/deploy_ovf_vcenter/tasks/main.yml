---
- name: Remove VMs if state is absent or forced
  include_tasks: absent.yml
  when: state == "absent" or state == "force"

- name: deploy to vcenter
  include_tasks: vmw_main.yml
  when: 
    - state != "absent"
    - vcenter_address|default('') != ''
    - vcenter_address != esxi_address
    - pve_address|default('') == ''

- name: deploy to esxi
  include_tasks: esx_main.yml
  when: 
    - state != "absent"
    - vcenter_address|default('') == '' or vcenter_address == esxi_address
    - pve_address|default('') == ''

- name: deploy to proxmox
  include_tasks: pve_main.yml 
  when: 
    - state != "absent"
    - pve_address|default('') != ''
  