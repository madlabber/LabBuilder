- name: Check if ISO exists on host
  stat:
    path: "{{ iso_path }}/{{autoinstall_iso}}"
  delegate_to: temp_host
  register: install_iso_exists

- name: create autoinstall iso 
  include_tasks: create_autoinstall_iso.yml
  when: not install_iso_exists.stat.exists

- name: Copy install iso to datastore
  copy:
    src: "{{ playbook_dir }}/files/{{autoinstall_iso}}"
    dest: "{{ iso_path }}/{{autoinstall_iso}}"
  delegate_to: temp_host
  when:
  - not install_iso_exists.stat.exists
