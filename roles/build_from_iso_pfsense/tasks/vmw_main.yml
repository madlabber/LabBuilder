- name: set host_type
  set_fact:
    host_type: "vmw"

- name: map login variables
  set_fact:
    vcenter_address: "{{ esxi_address }}"
    vcenter_username: "{{ esxi_username }}"
    vcenter_password: "{{ esxi_password }}"
    vcenter_datacenter: "ha-datacenter"
  delegate_to: localhost
  when: vcenter_address == ''

- name: create config file
  include_tasks: vmw/create_config_file.yml

- name: create config disk
  include_tasks: vmw/create_config_disk.yml

- name: Parse Networks
  include_tasks: vmw/parse_networks.yml

- name: upload install iso
  include_tasks: vmw/upload_install_iso.yml

- name: Build VM
  include_tasks: vmw/build_vm.yml

- name: Upload config file
  include_tasks: vmw/upload_config_file.yml
  when: config_xml_file != ""

- name: cleanup
  include_tasks: cleanup.yml