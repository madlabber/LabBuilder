- name: set host_type
  set_fact:
    host_type: "pve"

- name: Add PVE Host to Dynamic Inventory
  add_host:
    hostname: temp_host
    group: "temp_hosts"
    ansible_host: '{{ pve_address }}'
    ansible_user: '{{ pve_username }}'
    ansible_password: '{{ pve_password }}'
    ansible_ssh_common_args: '-o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no'

- name: Parse Networks
  include_tasks: pve/parse_networks.yml

- name: create config file
  include_tasks: pve/create_config_file.yml

- name: create config disk
  include_tasks: pve/create_config_disk.yml

- name: upload config disk
  include_tasks: pve/upload_config_disk.yml

- name: Upload install ISO
  include_tasks: pve/upload_install_iso.yml

- name: Build VM
  include_tasks: pve/build_vm.yml

# - name: Configure Guest
#   include_tasks: pve/configure_guest.yml

- name: Upload config.xml
  include_tasks: pve/upload_config_iso.yml
  when: config_xml_file != ""

- name: cleanup
  include_tasks: cleanup.yml
  


