---
- name: set host_type=vmw
  set_fact:
    host_type: "vmw"
  when: 
    - vcenter_address ~ esxi_address != ''
    - pve_address == ''

- name: set host_type=pve
  set_fact:
    host_type: "pve"
  when:
    - pve_address != ''

- name: Remove VMs if state is absent or forced
  include_tasks: "{{ host_type }}/absent.yml"

- name: build vm 
  include_tasks: "{{ host_type }}_main.yml"

