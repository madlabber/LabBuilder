
- name: set pve_vm_datastore
  set_fact:
    pve_vm_datastore: '{{ pve_datastores[vm_datastore]|default(vm_datastore) }}'

- name: Create new pfSense VM 
  community.general.proxmox_kvm:
    api_user: '{{ pve_username }}@pam'
    api_password: '{{ pve_password }}'
    api_host: '{{ pve_address }}'
    validate_certs: false
    state: present
    name: '{{ vm_name|replace("_", "-") }}'
    node: "{{ pve_node }}"
    net: "{{ networks }}"
    virtio:
      virtio0: '{{ pve_vm_datastore }}:{{ vm_disk_gb |int }}'
    ide:
      ide2: "{{iso_datastore}}:iso/{{install_iso}},media=cdrom"
    cores: 1
    vcpus: 1
    memory: '{{ vm_memory_mb |int}}'
    agent: true
  delegate_to: localhost
  register: create_vm

- name: Get VMID by Name
  community.proxmox.proxmox_kvm:
    api_user: '{{ pve_username }}@pam'
    api_password: '{{ pve_password }}'
    api_host: '{{ pve_address }}'
    validate_certs: false
    node: "{{ pve_node }}"
    name: '{{ vm_name|replace("_", "-") }}'
    state: current
  register: create_vm
  delegate_to: localhost
  retries: 3
  delay: 10
  until: create_vm is succeeded
  ignore_errors: true

# Disk order matters.
# The disk filter in the autosetup picks the first disk, so it must not be this one.
- name: Attach disks
  shell:  
    cmd: "qm set {{ create_vm.vmid }} --virtio1 {{ pve_vm_datastore }}:0,import-from={{ import_path }}/{{ vm_name }}-config.raw"
  delegate_to: temp_host

- name: Start VM
  community.general.proxmox_kvm:
    api_user: '{{ pve_username }}@pam'
    api_password: '{{ pve_password }}'
    api_host: '{{ pve_address }}'
    validate_certs: false
    state: started
    name: '{{ vm_name|replace("_", "-") }}'
  delegate_to: localhost
  retries: 3
  delay: 10
  register: create_vm
  until: create_vm is succeeded
  ignore_errors: true

- debug: 
    msg: "{{create_vm}}"

- name: 'Wait {{install_timer|default(90)}} seconds for boot'
  wait_for: 
    timeout: "{{install_timer|default(90)}}"
  delegate_to: localhost

- name: blind install
  command:
    cmd: "qm sendkey {{ create_vm.vmid }} {{item}}"
  delegate_to: temp_host
  # loop_control:
  #   pause: 5
  loop: 
    - "ret" # enter # ACCEPT
    - "ret" # enter # Install pfSense
    - "ret" # enter # AutoFS-OK (ZFS)
    - "ret" # enter # Proceed
    - "ret" # enter # stripe - no redundancy
    - "spc" # Select disk
    - "ret" # Accept Disk
    - "left" # YES
    - "ret" # Proceed with install

- name: 'Wait {{install_timer|default(90)}} seconds for install'
  wait_for: 
    timeout: "{{install_timer|default(90)}}"
  delegate_to: localhost

- name: Stop VM
  community.general.proxmox_kvm:
    api_user: '{{ pve_username }}@pam'
    api_password: '{{ pve_password }}'
    api_host: '{{ pve_address }}'
    validate_certs: false
    state: stopped
    force: true
    name: '{{ vm_name|replace("_", "-") }}'
  delegate_to: localhost

- name: Start VM
  community.general.proxmox_kvm:
    api_user: '{{ pve_username }}@pam'
    api_password: '{{ pve_password }}'
    api_host: '{{ pve_address }}'
    validate_certs: false
    state: started
    name: '{{ vm_name|replace("_", "-") }}'
  delegate_to: localhost

- name: 'Wait {{boot_timer|default(90)}} seconds for boot'
  wait_for: 
    timeout: "{{boot_timer|default(90)}}"
  delegate_to: localhost

- name: install qemu-guest-agent
  command:
    cmd: "qm sendkey {{ create_vm.vmid }} {{item}}"
  delegate_to: temp_host
  loop: 
    - 8 # enter # reboot
    - ret
    - p
    - k
    - g
    - spc 
    - i
    - n
    - s
    - t
    - a
    - l
    - l
    - spc
    - minus
    - y
    - spc 
    - q
    - e
    - m
    - u
    - minus
    - g
    - u
    - e
    - s
    - t
    - minus
    - a
    - g
    - e
    - n
    - t
    - ret

- name: install qemu-guest-agent
  command:
    cmd: 'qm sendkey {{ create_vm.vmid }} {{item}}'
  delegate_to: temp_host
  loop: 
    - s
    - e
    - r
    - v
    - i
    - c
    - e 
    - spc 
    - q
    - e
    - m
    - u
    - minus
    - g
    - u
    - e
    - s
    - t
    - minus
    - a
    - g
    - e
    - n
    - t
    - spc
    - o
    - n
    - e
    - s
    - t
    - a
    - r
    - t
    - ret

- name: invoke install-qemu-guest-agent
  command:
    cmd: "qm guest exec {{ create_vm.vmid }} -- {{item}}"
  delegate_to: temp_host
  loop_control:
    pause: 5
  loop: 
    - "/usr/local/bin/curl -LJO https://raw.githubusercontent.com/Weehooey/pfSense-scripts/main/install-qemu-guest-agent.sh"
    - "chmod +x install-qemu-guest-agent.sh"
    - "./install-qemu-guest-agent.sh"

- name: Detach Install ISO
  community.general.proxmox_disk:
    api_user: '{{ pve_username }}@pam'
    api_password: '{{ pve_password }}'
    api_host: '{{ pve_address }}'
    validate_certs: false
    #vmid: "{{ create_vm.vmid }}"
    name: '{{ vm_name|replace("_", "-") }}'
    disk: ide2
    media: cdrom
    state: detached
  delegate_to: localhost

- name: Detach config disk
  community.general.proxmox_disk:
    api_user: '{{ pve_username }}@pam'
    api_password: '{{ pve_password }}'
    api_host: '{{ pve_address }}'
    validate_certs: false
    #vmid: "{{ create_vm.vmid }}"
    name: '{{ vm_name|replace("_", "-") }}'
    disk: virtio1
    state: detached
  delegate_to: localhost
