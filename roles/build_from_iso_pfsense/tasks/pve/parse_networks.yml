- name: Add Network Adapter lan and wan
  set_fact:
    networks:
      net0: "{{ network_device_type }},bridge={{ pve_networks[ethernet_ports.wan|default(vm_network_wan)].bridge }}{{ (pve_networks[ethernet_ports.wan|default(vm_network_wan)].vlan is defined) | ternary(',tag=' ~ (pve_networks[ethernet_ports.wan|default(vm_network_wan)].vlan | default('')), '') }}"
      net1: "{{ network_device_type }},bridge={{ pve_networks[ethernet_ports.lan|default(vm_network_lan)].bridge }}{{ (pve_networks[ethernet_ports.lan|default(vm_network_lan)].vlan is defined) | ternary(',tag=' ~ (pve_networks[ethernet_ports.lan|default(vm_network_lan)].vlan | default('')), '') }}"

- name: Add opt1 if provided
  set_fact:
    networks: "{{ networks | combine({
      'net2': network_device_type ~ ',bridge=' ~ pve_networks[ethernet_ports.opt1].bridge ~ ((',tag=' ~ pve_networks[ethernet_ports.opt1].vlan) if pve_networks[ethernet_ports.opt1].vlan is defined else '') }) }}"
  when: ethernet_ports.opt1|default('') != ''

- name: Add opt2 if provided
  set_fact:
    networks: "{{ networks | combine({
      'net3': network_device_type ~ ',bridge=' ~ pve_networks[ethernet_ports.opt2].bridge ~ ((',tag=' ~ pve_networks[ethernet_ports.opt2].vlan) if pve_networks[ethernet_ports.opt2].vlan is defined else '') }) }}"
  when: ethernet_ports.opt2|default('') != ''

