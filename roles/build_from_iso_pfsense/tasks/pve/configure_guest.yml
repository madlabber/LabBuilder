- name: Get VMID by Name
  community.proxmox.proxmox_kvm:
    api_user: '{{ pve_username }}@pam'
    api_password: '{{ pve_password }}'
    api_host: '{{ pve_address }}'
    validate_certs: false
    node: "{{ pve_node }}"
    name: '{{ vm_name|replace("_", "-") }}'
    state: current
  register: create_vm
  delegate_to: localhost
  retries: 3
  delay: 10
  until: create_vm is succeeded
  ignore_errors: true

- name: Calculate bcrypt password hash for pfSense admin account (2b variant)
  set_fact:
    pfsense_hashed_password: "{{ vm_password | password_hash('blowfish', ident='2b', rounds=10) | regex_escape }}"

- name: Edit config.xml directly with sed and configure NAT/firewall
  command:
    cmd: "{{ item }}"
  delegate_to: temp_host
  loop_control:
    pause: 3
  loop:
    # Unblock Bogon/Private networks on the WAN interface
    - qm guest exec {{ create_vm.vmid }} -- cp /cf/conf/config.xml /cf/conf/config.orig
    - qm guest exec {{ create_vm.vmid }} -- sed -i '' -e '/<wan>/,/\/wan>/s/<blockbogon>.*<\/blockbogon>//g' -e '/<wan>/,/\/wan>/s/<blockbogon\/>//g' /cf/conf/config.xml
    - qm guest exec {{ create_vm.vmid }} -- sed -i '' -e '/<wan>/,/\/wan>/s/<blockpriv>.*<\/blockpriv>//g' -e '/<wan>/,/\/wan>/s/<blockpriv\/>//g' /cf/conf/config.xml

    # Set the LAN IP address and netmask
    - qm guest exec {{ create_vm.vmid }} -- sed -i '' -e '/<lan>/,/\/lan>/s/<ipaddr>.*<\/ipaddr>/<ipaddr>{{lan_address}}<\/ipaddr>/' /cf/conf/config.xml
    - qm guest exec {{ create_vm.vmid }} -- sed -i '' -e '/<lan>/,/\/lan>/s/<subnet>.*<\/subnet>/<subnet>{{lan_netmask_cidr}}<\/subnet>/' /cf/conf/config.xml
    
    # Set the hostname
    - qm guest exec {{ create_vm.vmid }} -- sed -i '' -e '/<system>/,/\/system>/s/<hostname>.*<\/hostname>/<hostname>{{vm_hostname}}<\/hostname>/' /cf/conf/config.xml
    # Set the domain name
    - qm guest exec {{ create_vm.vmid }} -- sed -i '' -e '/<system>/,/\/system>/s/<domain>.*<\/domain>/<domain>{{lan_domain}}<\/domain>/' /cf/conf/config.xml

    # Disable the startup setup wizard
    - qm guest exec {{ create_vm.vmid }} -- rm /conf/trigger_initial_wizard
    - qm guest exec {{ create_vm.vmid }} -- sed -i '' -e '/<webgui>/,/\/webgui>/s/<wizard>.*<\/wizard>//g' /cf/conf/config.xml
    - qm guest exec {{ create_vm.vmid }} -- sed -i '' -e '/<webgui>/,/\/webgui>/s|<\/webgui>|<wizard>false</wizard></webgui>|' /cf/conf/config.xml

    # Fix the lan DHCP range
    - qm guest exec {{ create_vm.vmid }} -- sed -i '' -e '/<dhcpd>/,/\/dhcpd>/s/<from>.*<\/from>/<from>{{lan_dhcp_start}}<\/from>/' /cf/conf/config.xml
    - qm guest exec {{ create_vm.vmid }} -- sed -i '' -e '/<dhcpd>/,/\/dhcpd>/s/<to>.*<\/to>/<to>{{lan_dhcp_end}}<\/to>/' /cf/conf/config.xml
    - qm guest exec {{ create_vm.vmid }} -- sed -i '' -e '/<dhcpd>/,/\/dhcpd>/s/<gateway>.*<\/gateway>/<gateway>{{lan_address}}<\/gateway>/' /cf/conf/config.xml

    # Set the password
    - qm guest exec {{ create_vm.vmid }} -- sed -i '' -e '/<user>/,/\/user>/s|<bcrypt-hash>.*</bcrypt-hash>|<bcrypt-hash>{{ pfsense_hashed_password }}</bcrypt-hash>|' /cf/conf/config.xml

    # Strip out any existing ssh blocks within the system block to prevent duplicates
    - qm guest exec {{ create_vm.vmid }} -- sed -i '' -e '/<system>/,/\/system>/s/<ssh>.*<\/ssh>//g' /cf/conf/config.xml
    # Inject a completely enabled ssh block right before the closing </system> tag
    - qm guest exec {{ create_vm.vmid }} -- sed -i '' -e '/<system>/,/\/system>/s|<\/system>|<ssh><enable>enabled</enable></ssh></system>|' /cf/conf/config.xml

    # VALIDATED INNER INJECTION: Safely appends your rule string immediately after the existing </outbound> tag
    - qm guest exec {{ create_vm.vmid }} -- sed -i '' -e 's|<\/outbound>|<\/outbound><rule><source><any><\/any><\/source><destination><network>wanip<\/network><port>3389<\/port><\/destination><ipprotocol>inet<\/ipprotocol><protocol>tcp<\/protocol><target>{{rdp_jumphost}}<\/target><local-port>3389<\/local-port><interface>wan<\/interface><descr><![CDATA[jumphost rdp]]></descr><associated-rule-id>pass<\/associated-rule-id><\/rule>|' /cf/conf/config.xml

    # UNBOUND DNS ACL INJECTION: Appends the "Allow All" ACL directly inside the closing </unbound> tag
    #- qm guest exec {{ create_vm.vmid }} -- sed -i '' -e 's|<\/unbound>|<acls><aclid>0<\/aclid><aclname><![CDATA[Allow All]]></aclname><aclaction>allow<\/aclaction><description><\/description><row><acl_network>0.0.0.0<\/acl_network><mask>0<\/mask><description><![CDATA[all]]></description><\/row><\/acls><\/unbound>|' /cf/conf/config.xml

    # UNBOUND DNS ACL & DOMAIN OVERRIDE INJECTION: Appends the ACL block AND the domain forwarder inside the closing </unbound> tag
    - qm guest exec {{ create_vm.vmid }} -- sed -i '' -e 's|<\/unbound>|<acls><aclid>0<\/aclid><aclname><![CDATA[Allow All]]></aclname><aclaction>allow<\/aclaction><description><\/description><row><acl_network>0.0.0.0<\/acl_network><mask>0<\/mask><description><![CDATA[all]]></description><\/row><\/acls><domainoverrides><domain>{{lan_domain}}<\/domain><ip>{{lan_dns_server|default(lan_address)}}<\/ip><descr><![CDATA[Forward lab.local]]></descr><\/domainoverrides><\/unbound>|' /cf/conf/config.xml

    # Delete the cache and reload the config
    - qm guest exec {{ create_vm.vmid }} -- rm -f /tmp/config.cache
    - qm guest exec {{ create_vm.vmid }} -- /etc/rc.reload_all
    - qm guest exec {{ create_vm.vmid }} -- /usr/local/sbin/pfSsh.php playback svc restart unbound

    # Now that the system config and NAT structures are cleanly loaded, punch the firewall hole
    - qm guest exec {{ create_vm.vmid }} -- /usr/local/bin/easyrule pass wan tcp any any 3389
    - qm guest exec {{ create_vm.vmid }} -- cp /cf/conf/config.xml /cf/conf/config.new