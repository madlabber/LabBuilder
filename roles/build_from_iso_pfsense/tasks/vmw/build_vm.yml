- name: setup login vars
  set_fact:
    vmw_login: &vmw_login
      hostname: '{{ vcenter_address }}'
      username: '{{ vcenter_username }}'
      password: '{{ vcenter_password }}'
      validate_certs: no

- name: Create VM 
  community.vmware.vmware_guest:
    <<: *vmw_login
    datacenter: "{{vcenter_datacenter}}"
    cluster: '{{vcenter_cluster|default(omit)}}'    
    folder: /
    name: '{{ vm_name }}'
    state: present
    guest_id: centos7_64Guest
    cdrom:
        - controller_number: 0
          unit_number: 0
          state: present
          type: iso
          iso_path: '[{{ iso_datastore }}] {{ install_iso }}'
    disk:
    - size_gb: '{{ vm_disk_gb |int }}'
      type: thin
      datastore: '{{ vm_datastore }}'
    hardware:
      memory_mb: '{{ vm_memory_mb |int}}'
      num_cpus: '{{ vm_num_cpus |int}}'
      scsi: lsilogicsas
    networks: "{{ networks }}"
    wait_for_ip_address: no
  delegate_to: localhost
  ignore_errors: true
  register: deploy_vm
  when: vm_network_opt1 == ""

- name: upload config disk
  include_tasks: upload_config_disk.yml

- name: attach config disk
  community.vmware.vmware_guest_disk:
    <<: *vmw_login
    datacenter: "{{vcenter_datacenter}}"
    name: '{{ vm_name }}'
    disk:
    - filename: '[{{ vm_datastore }}] {{ vm_name }}/pfsense_config.vmdk'
      scsi_controller: 0
      unit_number: 1
  delegate_to: localhost

- name: Set boot order
  community.vmware.vmware_guest_boot_manager:
    <<: *vmw_login
    name: '{{ vm_name }}'
    boot_delay: 1000
    enter_bios_setup: False
    boot_retry_enabled: True
    boot_retry_delay: 20000
    boot_firmware: bios
    secure_boot_enabled: False
    boot_order:
      - disk
      - cdrom
      - ethernet
      - floppy
  delegate_to: localhost

- name: Power-On the virtual machine
  community.vmware.vmware_guest_powerstate:
    <<: *vmw_login
    name: '{{ vm_name }}'
    state: powered-on
  delegate_to: localhost
  register: powerstate

- name: Check for VMware tools  
  community.vmware.vmware_guest_tools_wait:
    <<: *vmw_login
    name: '{{ vm_name }}'
    timeout: 60
  delegate_to: localhost
  register: alreadyinstalled           
  ignore_errors: true

- block:
  - name: Blind Install
    community.vmware.vmware_guest_sendkey:
      <<: *vmw_login
      name: "{{ vm_name }}"
      keys_send: "{{item}}"
    delegate_to: localhost
    loop_control:
      pause: 5
    loop: 
      - "ENTER" # enter # ACCEPT
      - "ENTER" # enter # Install pfSense
      - "ENTER" # enter # AutoFS-OK (ZFS)
      - "ENTER" # enter # Proceed
      - "ENTER" # enter # stripe - no redundancy
      - "SPACE" # Select disk
      - "ENTER" # Accept Disk
      - "LEFTARROW" # YES
      - "ENTER" # Proceed with install

  - name: 'Wait {{install_timer|default(90)}} seconds for install'
    wait_for: 
      timeout: "{{install_timer|default(90)}}"
    delegate_to: localhost

  - name: reboot after install
    community.vmware.vmware_guest_sendkey:
      <<: *vmw_login
      name: "{{ vm_name }}"
      keys_send: ENTER
      string_send: "{{item}}"
    delegate_to: localhost
    loop_control:
      pause: 5
    loop: 
      - "" # enter # open shell? -> No
      - "" # enter # reboot
      - "" # enter # extra enter

  - name: Wait for VMware tools to become available 
    community.vmware.vmware_guest_tools_wait:
      <<: *vmw_login
      name: '{{ vm_name }}'
    delegate_to: localhost
    retries: 1
    delay: 60
    register: vmtools_after_install         
    until: vmtools_after_install is succeeded
    when: alreadyinstalled is failed
    ignore_errors: true

  # If the install did not automatically reinstall
  # Open-VM-Tools fall back to sendkey
  - name: Blind Install part 3 - Open-VM-Tools
    community.vmware.vmware_guest_sendkey:
      <<: *vmw_login
      name: "{{ vm_name }}"
      keys_send: ENTER
      string_send: "{{item}}"
    delegate_to: localhost
    loop_control:
      pause: 5
    loop: 
      - "8" 
      - "8" 
      - "8" 
      - ""
      - "pkg-static install -y pfSense-pkg-Open-VM-Tools" # enter
      - "service vmware-guestd.sh start"
      - ""
    when: vmtools_after_install is failed

# prevent the default config from being reapplied after every reboot
- name: detach config disk
  community.vmware.vmware_guest_disk:
    <<: *vmw_login
    datacenter: "{{vcenter_datacenter}}"
    name: '{{ vm_name }}'
    disk:
    - state: absent
      scsi_controller: 0
      unit_number: 1
  delegate_to: localhost

