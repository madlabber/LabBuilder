- name: Create new VM 
  community.proxmox.proxmox_kvm:
    api_user: '{{ pve_username }}@pam'
    api_password: '{{ pve_password }}'
    api_host: '{{ pve_address }}'
    validate_certs: false
    state: present
    name: '{{ vm_name|replace("_", "-") }}'
    node: "{{ pve_node }}"
    net:
      net0: "virtio,bridge={{pve_networks[vm_network].bridge }}{{ (pve_networks[vm_network].vlan is defined) | ternary(',tag=' ~ (pve_networks[vm_network].vlan | default('')), '') }}"
    sata:
      sata0: '{{pve_vm_datastore}}:{{ vm_disk_gb |int }}'
    ide:
      ide1: "{{iso_datastore}}:iso/{{install_iso}},media=cdrom"
      ide2: "{{iso_datastore}}:iso/{{config_iso}},media=cdrom"
    cpu: host
    cores: '{{ vm_num_cpus|int }}'
    vcpus: '{{ vm_num_cpus|int }}'
    memory: '{{ vm_memory_mb |int}}'
    agent: true
  delegate_to: localhost
  register: create_vm
  retries: 3
  delay: 10
  until: create_vm is succeeded

- name: Attach Install ISO
  community.proxmox.proxmox_disk:
    api_user: '{{ pve_username }}@pam'
    api_password: '{{ pve_password }}'
    api_host: '{{ pve_address }}'
    validate_certs: false
    #vmid: "{{ create_vm.vmid }}"
    name: '{{ vm_name|replace("_", "-") }}'
    disk: ide1
    media: cdrom
    iso_image: "{{iso_datastore}}:iso/{{install_iso}}"
  delegate_to: localhost
  retries: 3
  delay: 10
  register: result
  until: result is succeeded

- name: Attach Config ISO
  community.proxmox.proxmox_disk:
    api_user: '{{ pve_username }}@pam'
    api_password: '{{ pve_password }}'
    api_host: '{{ pve_address }}'
    validate_certs: false
    #vmid: "{{ create_vm.vmid }}"
    name: '{{ vm_name|replace("_", "-") }}'
    disk: ide2
    media: cdrom
    iso_image: "{{iso_datastore}}:iso/{{config_iso}}"
  delegate_to: localhost
  retries: 3
  delay: 10
  register: result
  until: result is succeeded

# Fixme: Configure Serial Ports

- name: Start VM
  community.proxmox.proxmox_kvm:
    api_user: '{{ pve_username }}@pam'
    api_password: '{{ pve_password }}'
    api_host: '{{ pve_address }}'
    validate_certs: false
    state: started
    name: '{{ vm_name|replace("_", "-") }}'
  delegate_to: localhost
  retries: 3
  delay: 10
  register: result
  until: result is succeeded
  ignore_errors: true

- name: Get VMID by Name
  community.proxmox.proxmox_kvm:
    api_user: '{{ pve_username }}@pam'
    api_password: '{{ pve_password }}'
    api_host: '{{ pve_address }}'
    validate_certs: false
    node: "{{ pve_node }}"
    name: '{{ vm_name|replace("_", "-") }}'
    state: current
  register: create_vm
  delegate_to: localhost
  retries: 3
  delay: 10
  until: create_vm is succeeded
  ignore_errors: true

- name: Wait for 120 seconds for autoinstall confirmation prompt
  wait_for: timeout=120
  delegate_to: localhost

- name: trigger install
  command:
    cmd: 'qm sendkey {{ create_vm.vmid }} {{item}}'
  delegate_to: temp_host
  loop: 
    - y
    - e
    - s
    - ret

