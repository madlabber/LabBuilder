---
# Nutanix Community Edition 2.1 (AHV), nested on VMware.
# See README.md for how the unattended install works.

state: present
install_iso: "phoenix.x86_64-fnd_5.6.1_patch-aos_6.8.1_ga.iso"

# blank host addresses (set by mainvars)
pve_address: ""
esxi_address: ""
vcenter_address: ""
vcenter_cluster:

# vm defaults
vm_name:     ntnx
vm_hostname: ntnx
vm_network:  "VM Network"

# The CVM takes half of the node's cores (8 at most) and 20+ GB of RAM;
# AHV keeps 6 GB. What is left runs guest VMs.
vm_num_cpus:  8
vm_memory_mb: 49152
network_device_type: vmxnet3

# Disks: scsi0:0-2 in build_vm.yml, which the installer sees as sda, sdb and sdc.
# The answer file (templates/arizona.cfg.j2) assigns them; the CVM boot disk needs >= 200 GB.
hyp_disk_gb:  64
cvm_disk_gb:  500
data_disk_gb: 250
nutanix_hyp_boot_disk:  sda             # AHV boot
nutanix_cvm_boot_disks: [sdb]           # CVM boot
nutanix_cvm_data_disks: [sdc]           # data

# Node addresses
host_address:
vm_netmask:
vm_gateway:

# Unattended install (see README.md). The CE ISO is rebuilt once, in files/, into a copy whose
# boot line reads each node's answer file from a small seed ISO; nothing is typed into the console.
nutanix_unattended_iso: "{{ (install_iso | splitext)[0] }}-unattended.iso"
# Every seed ISO gets this volume date, which Linux shows as the volume UUID; the unattended ISO's
# boot line (AZ_HINT) finds the seed by it. Both forms are the same date.
nutanix_az_volume_date: "2026010100000000"
nutanix_az_uuid: "2026-01-01-00-00-00-00"
# The AOS version in install_iso, for the answer file (the installer doesn't detect it)
nutanix_aos_version: '{{ (install_iso | regex_findall("aos_([0-9][0-9.]*[0-9])") + [""]) | first }}'

# Cluster creation (create_cluster.yml)
nutanix_create_cluster: true           # false: stop once every CVM is up, for the user to create the cluster
nutanix_group: nutanix                 # inventory group holding the nodes
nutanix_cluster_name: "ntnx-ce"
nutanix_cluster_vip: ""                # optional Prism virtual IP
nutanix_dns_servers: ""                # comma separated
nutanix_ntp_servers: ""                # comma separated
nutanix_gateway_vm: "gateway"          # lab gateway VM, forwards SSH to the first CVM
nutanix_ssh_nat_port: 2222             # gateway WAN port forwarded to the first CVM's port 22
nutanix_cvm_username: nutanix
nutanix_cvm_password: "nutanix/4u"     # CE default
nutanix_admin_password: ""             # new Prism admin password; blank keeps the default
nutanix_cluster_wait: 5400             # how long to wait for the CVMs, in seconds

nutanix_lan_prefix_len: 24

# Managed AHV network on the lab LAN (lab_network.yml), for new and migrated VMs. Blank skips it.
# Keep its pool outside the gateway's DHCP range.
nutanix_lab_network: ""                # e.g. lab-lan
nutanix_lab_network_pool_start: ""
nutanix_lab_network_pool_end: ""
nutanix_lab_domain: ""                 # DNS search domain handed out on it

# Lab guide: create_cluster.yml writes it as HTML; a Windows VM can list it in
# extra_files and print it to PDF (see inventories/lab_nutanix.yml).
nutanix_guide_file: "{{ playbook_dir }}/files/{{ lab_name | default('nutanix') }}_nxguide.htm"
