---
# Deploys the Nutanix Move appliance as a VM on the AHV cluster (included from create_cluster.yml,
# after the cluster exists). Everything runs on the first CVM through the gateway's SSH forward:
#   1. copy the Move qcow2 to the CVM (SFTP)
#   2. import it into the image service from the CVM's own loopback (no firewall involved)
#   3. create and start the Move VM on the lab network (lab_network.yml), and wait for its web UI
- name: Check for the Move VM
  ansible.builtin.command:
    argv: "{{ cvm_ssh + ['300', 'bash -lc \"acli vm.list\"'] }}"
  environment:
    CVM_PASSWORD: "{{ nutanix_cvm_password }}"
  delegate_to: localhost
  register: move_vms
  changed_when: false

- name: Deploy Move
  when: nutanix_move_vm not in (move_vms.stdout_lines | map('split') | map('first') | list)
  block:
    - name: Check the Move image
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/files/{{ nutanix_move_image }}"
      delegate_to: localhost
      register: move_file
      failed_when: not move_file.stat.exists

    - name: Check the space on the CVM
      ansible.builtin.command:
        argv: "{{ cvm_ssh + ['0', 'df -Pk /home/nutanix | awk \"NR==2 {print \\$4}\"'] }}"
      environment:
        CVM_PASSWORD: "{{ nutanix_cvm_password }}"
      delegate_to: localhost
      register: move_space
      changed_when: false
      failed_when: (move_space.stdout | int) * 1024 < move_file.stat.size + 2 * 1024 * 1024 * 1024

    - name: Copy the Move image to the CVM ({{ (move_file.stat.size / 1024 / 1024 / 1024) | round(1) }} GB)
      ansible.builtin.command:
        argv: ["{{ ansible_playbook_python }}", "{{ role_path }}/files/cvm_put.py", "{{ nutanix_gateway_wan_ip }}",
               "{{ nutanix_ssh_nat_port | string }}", "{{ nutanix_cvm_username }}",
               "{{ playbook_dir }}/files/{{ nutanix_move_image }}", "/home/nutanix/{{ nutanix_move_image }}"]
      environment:
        CVM_PASSWORD: "{{ nutanix_cvm_password }}"
      delegate_to: localhost
      register: move_copy
      changed_when: move_copy.stdout == 'copied'

    - name: Import the image and create the Move VM
      ansible.builtin.command:
        argv: "{{ cvm_ssh + ['0', 'bash -lc ' ~ (move_script | quote)] }}"
      environment:
        CVM_PASSWORD: "{{ nutanix_cvm_password }}"
      delegate_to: localhost
      register: move_create
      vars:
        move_script: |
          set -e
          f={{ nutanix_move_image | quote }}
          # image: served from /home/nutanix on this CVM's loopback only, then removed
          if ! acli image.list | awk '{print $1}' | grep -qx {{ nutanix_move_vm }}-image; then
            ctr=$(ncli ctr ls | awk -F': ' '/^ *Name/ {print $2}' | grep -m1 -i default)
            cd /home/nutanix
            python3 -m http.server 8999 --bind 127.0.0.1 >/dev/null 2>&1 &
            web=$!
            sleep 3
            acli image.create {{ nutanix_move_vm }}-image source_url=http://127.0.0.1:8999/$f container="$ctr" image_type=kDiskImage
            kill $web
          fi
          rm -f /home/nutanix/$f
          # Move guide (AHV, Prism Element UI): 2 vCPU x 2 cores, 8 GB, legacy BIOS, disk cloned from the image
          acli vm.create {{ nutanix_move_vm }} num_vcpus={{ nutanix_move_vcpus }} num_cores_per_vcpu={{ nutanix_move_cores_per_vcpu }} memory={{ nutanix_move_memory }}
          acli vm.disk_create {{ nutanix_move_vm }} clone_from_image={{ nutanix_move_vm }}-image
          acli vm.nic_create {{ nutanix_move_vm }} network={{ nutanix_lab_network }} ip={{ nutanix_move_ip }}
          acli vm.on {{ nutanix_move_vm }}

    - name: Show the Move deployment
      ansible.builtin.debug:
        msg: "{{ move_create.stdout_lines[-6:] }}"

- name: Wait for the Move web UI (https://{{ nutanix_move_ip }})
  ansible.builtin.command:
    argv: "{{ cvm_ssh + ['1800', 'c=$(curl -sk -m 10 -o /dev/null -w %{http_code} https://' ~ nutanix_move_ip ~ '/); [ \"$c\" != 000 ]'] }}"
  environment:
    CVM_PASSWORD: "{{ nutanix_cvm_password }}"
  delegate_to: localhost
  changed_when: false
