---
- name: Build VM
  community.vmware.vmware_guest:
    hostname: '{{ vcenter_address }}'
    username: '{{ vcenter_username }}'
    password: '{{ vcenter_password }}'
    validate_certs: no
    datacenter: "{{ vcenter_datacenter }}"
    cluster: '{{ vcenter_cluster }}'
    folder: /
    name: '{{ vm_name }}'
    state: present
    guest_id: rhel8_64Guest
    datastore: '{{ vm_datastore }}'
    cdrom:
      - controller_number: 0
        controller_type: sata
        unit_number: 0
        state: present
        type: iso
        iso_path: '[{{ iso_datastore }}] {{ install_iso }}'
    disk:
      - size_gb: '{{ hyp_disk_gb }}'      # AHV boot
        type: thin
        controller_type: paravirtual
        controller_number: 0
        unit_number: 0
      - size_gb: '{{ cvm_disk_gb }}'      # CVM boot (the largest disk)
        type: thin
        controller_type: paravirtual
        controller_number: 0
        unit_number: 1
      - size_gb: '{{ data_disk_gb }}'     # data
        type: thin
        controller_type: paravirtual
        controller_number: 0
        unit_number: 2
    hardware:
      memory_mb: '{{ vm_memory_mb }}'
      num_cpus: '{{ vm_num_cpus }}'
      num_cpu_cores_per_socket: '{{ vm_num_cpus }}'
      nested_virt: true
      scsi: paravirtual
    advanced_settings:
      # disk serial numbers: the installer and the CVM track disks by serial
      - key: disk.EnableUUID
        value: "TRUE"
    networks:
      - name: '{{ vm_network }}'
        device_type: '{{ network_device_type }}'
    wait_for_ip_address: no
  delegate_to: localhost
  register: deploy_vm

- name: Set boot order
  community.vmware.vmware_guest_boot_manager:
    hostname: '{{ vcenter_address }}'
    username: '{{ vcenter_username }}'
    password: '{{ vcenter_password }}'
    validate_certs: no
    name: '{{ vm_name }}'
    boot_delay: 1000
    enter_bios_setup: False
    boot_retry_enabled: True
    boot_retry_delay: 20000
    boot_firmware: bios
    secure_boot_enabled: False
    boot_order:
      - disk      # empty on first boot, so the installer CD boots; AHV afterwards
      - cdrom
      - ethernet
  delegate_to: localhost
  # (only runs for a new VM; see vmw_main.yml)
