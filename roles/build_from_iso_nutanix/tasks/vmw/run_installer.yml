---
# The unattended CE ISO boots straight into the installer, which reads the node's answer file
# from the seed ISO, images AHV and the CVM, and reboots into AHV (the VM boots from disk first).
# create_cluster.yml then waits for every CVM.
- name: Power-On the virtual machine
  community.vmware.vmware_guest_powerstate:
    hostname: '{{ vcenter_address }}'
    username: '{{ vcenter_username }}'
    password: '{{ vcenter_password }}'
    validate_certs: no
    name: '{{ vm_name }}'
    state: powered-on
  delegate_to: localhost
