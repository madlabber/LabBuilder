---
- name: remove if absent or forced
  include_tasks: vmw/absent.yml
  when: state == "absent" or state == "force"

- name: Check whether the node VM already exists
  community.vmware.vmware_guest_info:
    hostname: '{{ vcenter_address }}'
    username: '{{ vcenter_username }}'
    password: '{{ vcenter_password }}'
    validate_certs: no
    datacenter: "{{ vcenter_datacenter }}"
    name: '{{ vm_name }}'
  delegate_to: localhost
  register: existing_vm
  failed_when: false
  when: state == "present" or state == "force"

# An installed node is left alone: re-running the playbook doesn't reinstall it.
# Use state=force to rebuild it.
- name: Build and install a new node
  when:
    - state == "present" or state == "force"
    - existing_vm.instance is not defined
  block:
    - name: Make the unattended CE ISO
      include_tasks: vmw/make_install_iso.yml

    - name: upload install iso
      include_tasks: vmw/upload_install_iso.yml

    - name: Make the node's answer file and seed ISO
      include_tasks: vmw/make_seed_iso.yml

    - name: Build VM
      include_tasks: vmw/build_vm.yml

    - name: Run the CE installer
      include_tasks: vmw/run_installer.yml
