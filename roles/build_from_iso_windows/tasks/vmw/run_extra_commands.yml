- name: set vm_username
  set_fact:
    vm_username: "administrator@{{domain}}"
  when:
    - join_domain|default(false) # or dcpromo|default(false)

- name: Fix PSReadLine module issue
  community.vmware.vmware_vm_shell:
    hostname: '{{ vcenter_address }}'
    username: '{{ vcenter_username }}'
    password: '{{ vcenter_password }}'
    validate_certs: false
    vm_username: '{{ vm_username }}'
    vm_password: '{{ vm_password_new }}'
    vm_id:       '{{ vm_name }}'
    vm_shell: 'c:\windows\system32\windowspowershell\v1.0\powershell.exe'
    vm_shell_args: ' -command "{{item}}"'
    wait_for_process: true
    timeout: 600
  delegate_to: localhost
  retries: 3
  delay: 10
  register: result
  until: result is succeeded
  ignore_errors: true
  loop_control:
    pause: 10
  loop: 
    - Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force
    - Install-Module PSReadLine -Force -AllowClobber    

- name: Run extra commands in powershell
  community.vmware.vmware_vm_shell:
    hostname: '{{ vcenter_address }}'
    username: '{{ vcenter_username }}'
    password: '{{ vcenter_password }}'
    validate_certs: false
    vm_username: '{{ vm_username }}'
    vm_password: '{{ vm_password_new }}'
    vm_id: '{{ vm_name }}'
    vm_shell: 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
    vm_shell_args: >-
      -NoProfile -NonInteractive -ExecutionPolicy Bypass
      -EncodedCommand {{ item | b64encode(encoding='utf-16-le') }}
    wait_for_process: true
    timeout: 600
  delegate_to: localhost
  loop: "{{ extra_commands | default([]) }}"
  retries: 3
  delay: 10
  register: result
  until: result is succeeded
  ignore_errors: true
  loop_control:
    pause: 10
    label: "{{ item }}"
  when:
    - extra_commands is defined
    - extra_commands | length > 0
