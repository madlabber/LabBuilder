- name: Create new VM 
  community.proxmox.proxmox_kvm:
    api_user: '{{ pve_username }}@pam'
    api_password: '{{ pve_password }}'
    api_host: '{{ pve_address }}'
    validate_certs: false
    state: present
    name: '{{ vm_name|replace("_", "-") }}'
    node: "{{ pve_node }}"
    net:
      net0: "e1000,bridge={{pve_networks[vm_network].bridge }}{{ (pve_networks[vm_network].vlan is defined) | ternary(',tag=' ~ (pve_networks[vm_network].vlan | default('')), '') }}"
    sata:
      sata0: '{{ pve_datastores[vm_datastore]|default(vm_datastore) }}:{{ vm_disk_gb |int }}'
    ide:
      ide1: "{{iso_datastore}}:iso/{{install_iso}},media=cdrom"
      ide2: "{{iso_datastore}}:iso/{{config_iso}},media=cdrom"
    cpu: host
    cores: '{{ vm_num_cpus|int }}'
    vcpus: '{{ vm_num_cpus|int }}'
    memory: '{{ vm_memory_mb |int}}'
    agent: true
  delegate_to: localhost
  register: create_vm
  # if the host is busy we may see duplicate vmid errors
  retries: 10
  delay: 10
  until: create_vm is succeeded

- name: Attach Install ISO
  community.proxmox.proxmox_disk:
    api_user: '{{ pve_username }}@pam'
    api_password: '{{ pve_password }}'
    api_host: '{{ pve_address }}'
    validate_certs: false
    #vmid: "{{ create_vm.vmid }}"
    name: '{{ vm_name|replace("_", "-") }}'
    disk: ide1
    media: cdrom
    iso_image: "{{iso_datastore}}:iso/{{install_iso}}"
  delegate_to: localhost
  retries: 3
  delay: 10
  register: attach_install_iso
  until: attach_install_iso is succeeded
  ignore_errors: true

- name: Attach Config ISO
  community.proxmox.proxmox_disk:
    api_user: '{{ pve_username }}@pam'
    api_password: '{{ pve_password }}'
    api_host: '{{ pve_address }}'
    validate_certs: false
    #vmid: "{{ create_vm.vmid }}"
    name: '{{ vm_name|replace("_", "-") }}'
    disk: ide2
    media: cdrom
    iso_image: "{{iso_datastore}}:iso/{{config_iso}}"
  delegate_to: localhost
  retries: 3
  delay: 10
  register: attach_config_iso
  until: attach_config_iso is succeeded
  ignore_errors: true

- name: Start VM
  community.proxmox.proxmox_kvm:
    api_user: '{{ pve_username }}@pam'
    api_password: '{{ pve_password }}'
    api_host: '{{ pve_address }}'
    validate_certs: false
    state: started
    name: '{{ vm_name|replace("_", "-") }}'
  delegate_to: localhost
  retries: 3
  delay: 10
  register: result
  until: result is succeeded
  ignore_errors: true

- name: Get VMID by Name
  community.proxmox.proxmox_kvm:
    api_user: '{{ pve_username }}@pam'
    api_password: '{{ pve_password }}'
    api_host: '{{ pve_address }}'
    validate_certs: false
    node: "{{ pve_node }}"
    name: '{{ vm_name|replace("_", "-") }}'
    state: current
  register: create_vm
  delegate_to: localhost
  retries: 3
  delay: 10
  until: create_vm is succeeded
  ignore_errors: true

- name: Wait until QEMU agent reports a valid IPv4 address
  ansible.builtin.command: "qm guest cmd {{ create_vm.vmid }} network-get-interfaces"
  delegate_to: temp_host
  register: qm_output
  changed_when: false
  # Retry logic
  until: >
    qm_output.rc == 0 and 
    (qm_output.stdout | from_json) 
    | rejectattr('name', 'equalto', 'lo') 
    | map(attribute='ip-addresses') 
    | flatten 
    | selectattr('ip-address-type', 'equalto', 'ipv4') 
    | list 
    | length > 0
  retries: 60                    # Total number of attempts
  delay: 60  

- name: Pause for first boot commands (120 sec)
  wait_for: timeout=120
  delegate_to: localhost

