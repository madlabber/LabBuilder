---
- name: Build VM
  community.vmware.vmware_guest:
    hostname: '{{ vcenter_address }}'
    username: '{{ vcenter_username }}'
    password: '{{ vcenter_password }}'
    validate_certs: no
    datacenter: "{{ vcenter_datacenter }}"
    cluster: '{{ vcenter_cluster }}'
    folder: /
    name: '{{ vm_name }}'
    state: present
    guest_id: ubuntu64Guest
    datastore: '{{ vm_datastore }}'
    # the unattended installer, this host's seed (CIDATA), then any extra ISOs
    cdrom: "{{ hvm_cdroms }}"
    disk:
      - size_gb: '{{ os_disk_gb }}'       # HVM OS
        type: thin
        controller_type: paravirtual
        controller_number: 0
        unit_number: 0
      - size_gb: '{{ data_disk_gb }}'     # local VM storage
        type: thin
        controller_type: paravirtual
        controller_number: 0
        unit_number: 1
    hardware:
      memory_mb: '{{ vm_memory_mb }}'
      num_cpus: '{{ vm_num_cpus }}'
      num_cpu_cores_per_socket: '{{ vm_num_cpus }}'   # one socket
      nested_virt: true
      boot_firmware: efi
      secure_boot: false
      scsi: paravirtual
    # two NICs on the lab LAN: the first becomes vs0 (management); the second is free for VM traffic
    networks:
      - name: '{{ vm_network }}'
        device_type: '{{ network_device_type }}'
        mac: '{{ hvm_mac }}'
      - name: '{{ vm_network }}'
        device_type: '{{ network_device_type }}'
    wait_for_ip_address: no
  delegate_to: localhost
  vars:
    hvm_cdroms: >-
      {%- set isos = [hvm_auto_iso, hvm_seed_iso] + hvm_extra_isos -%}
      {%- set out = [] -%}
      {%- for iso in isos -%}
      {%- set _ = out.append({'controller_number': 0, 'controller_type': 'sata', 'unit_number': loop.index0,
                              'state': 'present', 'type': 'iso', 'iso_path': '[' ~ iso_datastore ~ '] ' ~ iso}) -%}
      {%- endfor -%}
      {{ out }}

# The disk is empty on first boot, so the installer CD boots; HVM OS afterwards
- name: Set boot order
  community.vmware.vmware_guest_boot_manager:
    hostname: '{{ vcenter_address }}'
    username: '{{ vcenter_username }}'
    password: '{{ vcenter_password }}'
    validate_certs: no
    name: '{{ vm_name }}'
    boot_delay: 1000
    enter_bios_setup: False
    boot_retry_enabled: True
    boot_retry_delay: 20000
    boot_firmware: efi
    secure_boot_enabled: False
    boot_order:
      - disk
      - cdrom
      - ethernet
  delegate_to: localhost

# The install runs on its own (about 15 minutes) and reboots into HVM OS. LabBuilder can't
# reach the lab LAN, so stage 2 waits for the hosts over SSH from inside the lab.
- name: Power on (starts the unattended install)
  community.vmware.vmware_guest_powerstate:
    hostname: '{{ vcenter_address }}'
    username: '{{ vcenter_username }}'
    password: '{{ vcenter_password }}'
    validate_certs: no
    name: '{{ vm_name }}'
    state: powered-on
  delegate_to: localhost
