---
- name: HVM hosts are only built on VMware for now
  ansible.builtin.fail:
    msg: "build_from_iso_hvm supports vCenter targets only (pve_address is set)."
  when: pve_address|default('') != ''

- name: build vm on VMware
  include_tasks: vmw_main.yml
  when:
    - vcenter_address|default('') != ''
