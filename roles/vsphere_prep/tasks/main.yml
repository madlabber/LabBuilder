---
- name: Wait for the vCenter API ({{ vcenter_address }})
  community.vmware.vmware_about_info:
    hostname: "{{ vcenter_address }}"
    username: "{{ vcenter_username }}"
    password: "{{ vcenter_password }}"
    validate_certs: no
  delegate_to: localhost
  register: vsphere_prep_about
  until: vsphere_prep_about is succeeded
  retries: "{{ (vsphere_prep_wait | int / 60) | int }}"
  delay: 60

- name: Create the datacenter
  community.vmware.vmware_datacenter:
    hostname: "{{ vcenter_address }}"
    username: "{{ vcenter_username }}"
    password: "{{ vcenter_password }}"
    validate_certs: no
    datacenter_name: "{{ vcenter_datacenter }}"
    state: present
  delegate_to: localhost

- name: Create the cluster
  vmware.vmware.cluster:            # community.vmware.vmware_cluster was removed in community.vmware 6.0
    hostname: "{{ vcenter_address }}"
    username: "{{ vcenter_username }}"
    password: "{{ vcenter_password }}"
    validate_certs: no
    datacenter: "{{ vcenter_datacenter }}"
    cluster: "{{ vcenter_cluster }}"
  delegate_to: localhost

- name: Add the ESXi hosts
  community.vmware.vmware_host:
    hostname: "{{ vcenter_address }}"
    username: "{{ vcenter_username }}"
    password: "{{ vcenter_password }}"
    validate_certs: no
    datacenter: "{{ vcenter_datacenter }}"
    cluster: "{{ vcenter_cluster }}"
    esxi_hostname: "{{ item }}"
    esxi_username: "{{ esxi_username }}"
    esxi_password: "{{ esxi_password }}"
    state: present
  loop: "{{ esx_hosts }}"
  delegate_to: localhost
  register: vsphere_prep_add_host
  until: vsphere_prep_add_host is succeeded
  retries: 20          # a host may still be finishing its install
  delay: 30

# ESXi 8 keeps its whole boot disk for itself, so the first host gets lab_vm_datastore on its
# largest disk (the lab's separate data disk), unless it already has it
- name: List the first host's disks
  community.vmware.vmware_host_disk_info:
    hostname: "{{ vcenter_address }}"
    username: "{{ vcenter_username }}"
    password: "{{ vcenter_password }}"
    validate_certs: no
    esxi_hostname: "{{ esx_hosts[0] }}"
  delegate_to: localhost
  register: vsphere_prep_disks
  when: esx_hosts | length > 0

- name: Create {{ lab_vm_datastore }} on the first host
  community.vmware.vmware_host_datastore:
    hostname: "{{ vcenter_address }}"
    username: "{{ vcenter_username }}"
    password: "{{ vcenter_password }}"
    validate_certs: no
    esxi_hostname: "{{ esx_hosts[0] }}"
    datastore_name: "{{ lab_vm_datastore }}"
    datastore_type: vmfs
    vmfs_device_name: "{{ (vsphere_prep_disks.hosts_disk_info[esx_hosts[0]] | sort(attribute='capacity_mb') | last).canonical_name }}"
    vmfs_version: 6
    state: present
  delegate_to: localhost
  when: esx_hosts | length > 0

- name: Upload installer ISOs
  ansible.builtin.include_tasks: upload_isos.yml
  when: isos | length > 0
