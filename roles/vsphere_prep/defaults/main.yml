---
# Prepares a freshly deployed vCenter: datacenter, cluster, ESXi hosts, a datastore, installer ISOs.
# Run where the vCenter and its hosts are reachable directly, e.g. inside a lab (stage 2).
# Everything else comes from the usual LabBuilder variables: vcenter_address, vcenter_username,
# vcenter_password, vcenter_datacenter, vcenter_cluster, esxi_username and esxi_password from the
# mainvars file (vars/main.yml), and lab_vm_datastore from the lab inventory.
vsphere_prep_wait: 5400        # seconds to wait for a vCenter that is still in its first boot

# FQDNs of the ESXi hosts to add. The first gets lab_vm_datastore on its largest empty disk if it
# has none; ESXi 8 keeps its boot disk for itself, so give the host a separate data disk.
esx_hosts: []

# Installer ISOs (files in files/) uploaded to [lab_vm_datastore] ISO/. Set it on the host in the
# inventory or pass it as an extra var: -e '{"isos": ["debian-12.11.0-amd64-netinst.iso"]}'
isos: []
