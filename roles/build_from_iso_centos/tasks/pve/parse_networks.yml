
- name: Add Network Adapter eth0
  set_fact:
    networks:
      net0: "{{ network_device_type }},bridge={{ pve_networks[ethernet_ports.eth0|default(vm_network)].bridge }}{{ (pve_networks[ethernet_ports.eth0|default(vm_network)].vlan is defined) | ternary(',tag=' ~ (pve_networks[ethernet_ports.eth0|default(vm_network)].vlan | default('')), '') }}"

- name: Add Network Adapter eth1
  set_fact:
    networks:
      net0: "{{ network_device_type }},bridge={{ pve_networks[ethernet_ports.eth0|default(vm_network)].bridge }}{{ (pve_networks[ethernet_ports.eth0|default(vm_network)].vlan is defined) | ternary(',tag=' ~ (pve_networks[ethernet_ports.eth0|default(vm_network)].vlan | default('')), '') }}"
      net1: "{{ network_device_type }},bridge={{ pve_networks[ethernet_ports.eth1|default(vm_network)].bridge }}{{ (pve_networks[ethernet_ports.eth1|default(vm_network)].vlan is defined) | ternary(',tag=' ~ (pve_networks[ethernet_ports.eth1|default(vm_network)].vlan | default('')), '') }}"
  when: >
    vm_num_nics|int >= 2 or 
    ethernet_ports.eth1|default('') != '' or
    ethernet_ports.eth2|default('') != '' or
    ethernet_ports.eth3|default('') != '' or 
    ethernet_ports.eth4|default('') != '' or 
    ethernet_ports.eth5|default('') != '' or 
    ethernet_ports.eth6|default('') != '' or 
    ethernet_ports.eth7|default('') != ''

