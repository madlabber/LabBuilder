- name: Create new VM 
  community.proxmox.proxmox_kvm:
    api_user: '{{ pve_username }}@pam'
    api_password: '{{ pve_password }}'
    api_host: '{{ pve_address }}'
    validate_certs: false
    state: present
    name: '{{ vm_name|replace("_", "-") }}'
    node: "{{ pve_node }}"
    net: "{{ networks }}"
    scsihw: 'virtio-scsi-pci'
    scsi:
      scsi0: "{{ (disks[0].size_gb|default('') != '') | ternary( pve_vm_datastore~':'~disks[0].size_gb|default(omit) , omit ) }}"
      scsi1: "{{ (disks[1].size_gb|default('') != '') | ternary( pve_vm_datastore~':'~disks[1].size_gb|default(omit) , omit ) }}"
      scsi2: "{{ (disks[2].size_gb|default('') != '') | ternary( pve_vm_datastore~':'~disks[2].size_gb|default(omit) , omit ) }}"
      scsi3: "{{ (disks[3].size_gb|default('') != '') | ternary( pve_vm_datastore~':'~disks[3].size_gb|default(omit) , omit ) }}"
      scsi4: "{{ (disks[4].size_gb|default('') != '') | ternary( pve_vm_datastore~':'~disks[4].size_gb|default(omit) , omit ) }}"
      scsi5: "{{ (disks[5].size_gb|default('') != '') | ternary( pve_vm_datastore~':'~disks[5].size_gb|default(omit) , omit ) }}"
      scsi6: "{{ (disks[6].size_gb|default('') != '') | ternary( pve_vm_datastore~':'~disks[6].size_gb|default(omit) , omit ) }}"
    ide:
      ide1: "{{iso_datastore}}:iso/{{install_iso}},media=cdrom"
      ide2: "{{iso_datastore}}:iso/{{config_iso}},media=cdrom"
    cpu: host
    cores: '{{ vm_num_cpus|int }}'
    vcpus: '{{ vm_num_cpus|int }}'
    memory: '{{ vm_memory_mb |int}}'
    agent: true
  delegate_to: localhost
  register: create_vm
  retries: 3
  delay: 10
  until: create_vm is succeeded

- name: Attach Install ISO
  community.proxmox.proxmox_disk:
    api_user: '{{ pve_username }}@pam'
    api_password: '{{ pve_password }}'
    api_host: '{{ pve_address }}'
    validate_certs: false
    #vmid: "{{ create_vm.vmid }}"
    name: '{{ vm_name|replace("_", "-") }}'
    disk: ide1
    media: cdrom
    iso_image: "{{iso_datastore}}:iso/{{install_iso}}"
  delegate_to: localhost
  retries: 3
  delay: 10
  register: result
  until: result is succeeded

- name: Attach Config ISO
  community.proxmox.proxmox_disk:
    api_user: '{{ pve_username }}@pam'
    api_password: '{{ pve_password }}'
    api_host: '{{ pve_address }}'
    validate_certs: false
    #vmid: "{{ create_vm.vmid }}"
    name: '{{ vm_name|replace("_", "-") }}'
    disk: ide2
    media: cdrom
    iso_image: "{{iso_datastore}}:iso/{{config_iso}}"
  delegate_to: localhost
  retries: 3
  delay: 10
  register: result
  until: result is succeeded

# Fixme: Configure Serial Ports

- name: Start VM
  community.proxmox.proxmox_kvm:
    api_user: '{{ pve_username }}@pam'
    api_password: '{{ pve_password }}'
    api_host: '{{ pve_address }}'
    validate_certs: false
    state: started
    name: '{{ vm_name|replace("_", "-") }}'
  delegate_to: localhost
  retries: 3
  delay: 10
  register: result
  until: result is succeeded
  ignore_errors: true
  
- name: Wait for 30 seconds for menu
  wait_for: timeout=30
  delegate_to: localhost

- name: trigger install
  command:
    cmd: 'qm sendkey {{ create_vm.vmid }} {{item}}'
  delegate_to: temp_host
  loop: 
    - shift-i
    - ret

- name: Wait until QEMU agent reports a valid IPv4 address
  ansible.builtin.command: "qm guest cmd {{ create_vm.vmid }} network-get-interfaces"
  delegate_to: temp_host
  register: qm_output
  changed_when: false
  # Retry logic
  until: >
    qm_output.rc == 0 and 
    (qm_output.stdout | from_json) 
    | rejectattr('name', 'equalto', 'lo') 
    | map(attribute='ip-addresses') 
    | flatten 
    | selectattr('ip-address-type', 'equalto', 'ipv4') 
    | list 
    | length > 0
  retries: 60                    # Total number of attempts
  delay: 60  

- name: Wait for 60 seconds for guest to settle
  wait_for: timeout=60
  delegate_to: localhost
