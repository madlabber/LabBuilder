all:
  hosts:
  vars:
    lab_name: lab_hyperv2025
    lab_prefix: "{{ lab_name }}_"
    lab_netmask: 255.255.255.0
    lab_password: P@ssw0rd
    lab_vm_datastore: "{{ lab_name }}"
    lab_wan_portgroup: "{{ vm_network }}"
    lab_lan1_portgroup: "{{ lab_name }}_net1"
    lab_lan2_portgroup: "{{ lab_name }}_net2"
    lab_lan1_netmask_cidr: "24"
    lab_lan1_netmask: "255.255.255.0"
    lab_lan1_gateway: "192.168.0.1"
    lab_lan1_dns_ip: "192.168.0.11"
    lab_domain_name:   "lab.test"
    lab_domain_controller: "dc01"
  children:
    pfsense:
      hosts:
        gateway:
          lan:
            address:      192.168.0.1
            netmask_cidr: 24
            domain:       lab.test
            dns_server:   192.168.0.11
            dhcp_start:   192.168.0.150
            dhcp_end:     192.168.0.200
          opt1:
            address:      192.168.10.1
            netmask_cidr: 24
            dhcp_start:   192.168.10.100
            dhcp_end:     192.168.10.199
          nat_rules:
          - name: "RDP to Jumphost"
            external_port: "3389"
            internal_port: "3389"
            protocol: "tcp"
            target_ip: 192.168.0.11
          interfaces:
            wan: "{{lab_wan_portgroup}}"
            lan: "{{lab_lan1_portgroup}}"
            opt1: "{{ lab_lan2_portgroup }}"
    dc:
      hosts:
        dc01:
          version: "Server2025eval"
          ip_address: 192.168.0.11
          extra_files_urls:
            - https://dl.google.com/chrome/install/googlechromestandaloneenterprise64.msi
            - http://the.earth.li/~sgtatham/putty/0.83/w64/putty-64bit-0.83-installer.msi
          extra_commands:
            - MsiExec.exe /i E:\files\putty-64bit-0.83-installer.msi /qn
            - MsiExec.exe /i E:\files\googlechromestandaloneenterprise64.msi /qn
            - Install-WindowsFeature -Name RSAT-Hyper-V-Tools

    winservers:
      hosts:
        hv1:
          ip_address: 192.168.0.61
        hv2:
          ip_address: 192.168.0.62
        hv3:
          ip_address: 192.168.0.63
        hv4:
          ip_address: 192.168.0.64
      vars:
          nested_virtualization: true
          version: "Server2025eval"
          vm_memory_mb: 24576
          vm_num_cpus: 6
          ethernet_ports:
            eth0: "{{ lab_lan1_portgroup }}"
            eth1: "{{ lab_lan1_portgroup }}"
            eth2: "{{ lab_lan2_portgroup }}"
            eth3: "{{ lab_lan2_portgroup }}"
          disks:
            - size_gb: 200
              type: "thin"
            - size_gb: 2600
              type: "thin"
          vm_disk_gb: 200
          join_domain: true
          extra_commands:
            - Install-WindowsFeature -Name Hyper-V -IncludeManagementTools -Restart

    ontapselecteval:
      hosts:
        ots-01:  
          ontap_version: "9.19.1"       
          ovf_file: files/ONTAPSelect_standalone_9191_ESX_NODAR.ova  
          ontap_deployment_option: ONTAPSelectSmall
          ontap_node_mgmt_ip:    192.168.0.91
          ontap_cluster_name:    "demo"
          ontap_cluster_mgmt_ip: 192.168.0.90
          vm_data_disk_gb:       2048
