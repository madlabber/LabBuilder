all:
  hosts:
  vars:
    lab_name: lab_svmdr
    lab_prefix: "{{ lab_name }}_"
    lab_password: P@ssw0rd
    lab_vm_datastore: lab_svmdr
    lab_wan_portgroup: "VM Network"
    lab_lan1_portgroup: "lab_svmdr_net1"
    lab_lan1_netmask_cidr: "24"
    lab_lan1_netmask: "255.255.255.0"
    lab_lan1_gateway: "192.168.0.1"
    lab_lan1_dns_ip: "192.168.0.1"
    lab_domain_name:   "lab.local"
    lab_domain_controller: "dc01"
  children:
    pfsense:
      hosts:
        gateway:
          lan:
            address:      192.168.0.1
            netmask_cidr: 24
            domain:       lab.test
            dns_server:   192.168.0.11
            dhcp_start:   192.168.0.150
            dhcp_end:     192.168.0.200
          nat_rules:
          - name: "RDP to Jumphost"
            external_port: "3389"
            internal_port: "3389"
            protocol: "tcp"
            target_ip: 192.168.0.11
          interfaces:
            wan: "{{lab_wan_portgroup}}"
            lan: "{{lab_lan1_portgroup}}"
    dc:
      hosts:
        dc01:
          version: "Server2025eval"
          ip_address: 192.168.0.11
          extra_files_urls:
            - https://dl.google.com/chrome/install/googlechromestandaloneenterprise64.msi
            - http://the.earth.li/~sgtatham/putty/0.83/w64/putty-64bit-0.83-installer.msi
          extra_commands:
            - MsiExec.exe /i E:\files\putty-64bit-0.83-installer.msi /qn
            - MsiExec.exe /i E:\files\googlechromestandaloneenterprise64.msi /qn
    ontapselecteval:
      hosts:
        cluster1:         
          ontap_node_mgmt_ip:    192.168.0.111
          ontap_cluster_name:    "cluster1"
          ontap_cluster_mgmt_ip: 192.168.0.110
        cluster2:            
          ontap_node_mgmt_ip:    192.168.0.121
          ontap_cluster_name:    "cluster2"
          ontap_cluster_mgmt_ip: 192.168.0.120
        cluster3:           
          ontap_node_mgmt_ip:    192.168.0.131
          ontap_cluster_name:    "cluster3"
          ontap_cluster_mgmt_ip: 192.168.0.130
      vars:
          ontap_version: "9.19.1"       
          ovf_file: files/ONTAPSelect_standalone_9191_ESX_NODAR.ova  
          ontap_deployment_option: ONTAPSelectSmall
          vm_data_disk_gb:       1024
