all:
  hosts:
  vars:
    lab_name: lab_select2n_rocky9
    lab_prefix: "{{ lab_name }}_"
    lab_password: P@ssw0rd
    lab_vm_datastore: "{{ lab_name }}"
    lab_wan_portgroup: "VM Network"
    lab_lan1_portgroup: "{{ lab_name }}_net1"
    lab_lan1_netmask_cidr: "24"
    lab_lan1_netmask: "255.255.255.0"
    lab_lan1_gateway: "192.168.0.1"
    lab_lan1_dns_ip: "192.168.0.1"
    lab_domain_name:   "lab.test"
    lab_domain_controller: "dc01"
  children:
    pfsense:
      hosts:
        gateway:
          lan:
            address:      192.168.0.1
            netmask_cidr: 24
            domain:       lab.test
            dns_server:   192.168.0.11
            dhcp_start:   192.168.0.150
            dhcp_end:     192.168.0.200
          nat_rules:
          - name: "RDP to Jumphost"
            external_port: "3389"
            internal_port: "3389"
            protocol: "tcp"
            target_ip: 192.168.0.11
          interfaces:
            wan: "{{lab_wan_portgroup}}"
            lan: "{{lab_lan1_portgroup}}"
    dc:
      hosts:
        dc01:
          version: "Server2022eval"
          ip_address: 192.168.0.11
          extra_files_urls:
            - https://dl.google.com/chrome/install/googlechromestandaloneenterprise64.msi
            - http://the.earth.li/~sgtatham/putty/0.83/w64/putty-64bit-0.83-installer.msi
          extra_commands:
            - MsiExec.exe /i E:\files\putty-64bit-0.83-installer.msi /qn
            - MsiExec.exe /i E:\files\googlechromestandaloneenterprise64.msi /qn
    centos:
      hosts:
        kvm1:
          ip_address: 192.168.0.41
        kvm2:
          ip_address: 192.168.0.42
        kvm3:
          ip_address: 192.168.0.43
      vars:
        vm_memory_mb: 24576
        vm_num_cpus: 6
        vm_disk_gb: 160
        install_xrdp: true
        install_ansible: true
        distro: "rocky"
        version: "9.6"
        nested_virtualization: true
        disks:
          - size_gb: 160
            type: thin
          - size_gb: 3072
            type: thin
        network_device_type: e1000
        ethernet_ports:
          eth0: "{{ lab_lan1_portgroup }}"
          eth1: "{{ lab_lan1_portgroup }}"
          eth2: "{{ lab_lan1_portgroup }}"
        # extra_commands:
        #   # enable serial console on EL8 variants
        #   - 'grub2-editenv - set "$(grub2-editenv - list | grep kernelopts) console=tty0 console=ttyS0,115200"'

