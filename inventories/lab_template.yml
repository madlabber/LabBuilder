all:
  hosts:
  vars:
    lab_name: lab_template
    lab_prefix: "{{ lab_name }}_"
    lab_netmask: 255.255.255.0
    lab_password: P@ssw0rd
    lab_vm_datastore: "{{ lab_name }}"
    lab_wan_portgroup: "{{ vm_network }}"
    lab_lan1_portgroup: "{{ lab_name }}_net1"
    lab_lan1_netmask_cidr: "24"
    lab_lan1_netmask: "255.255.255.0"
    lab_lan1_gateway: "192.168.0.1"
    lab_lan1_dns_ip: "192.168.0.11"
    lab_domain_name:   "lab.internal"
    lab_domain_controller: "dc01"
  children:
    pfsense:
      hosts:
        gateway:
          lan_address:      192.168.0.1
          lan_netmask_cidr: 24
          lan_domain:       demo.com
          lan_dns_server:   192.168.0.11
          lan_dhcp_start:   192.168.0.150
          lan_dhcp_end:     192.168.0.200
          nat_rules:
            - name: "RDP to Jumphost"
              external_port: "3389"
              internal_port: "3389"
              protocol: "tcp"
              target_ip: 192.168.0.11
          ethernet_ports:
            wan: "{{lab_wan_portgroup}}"
            lan: "{{lab_lan1_portgroup}}"
            # opt1: "{{ lab_opt1_portgroup }}"
            # opt2: "{{ lab_opt2_portgroup }}"
            # opt3: "{{ lab_opt3_portgroup }}"
            # opt4: "{{ lab_opt4_portgroup }}"
            # opt5: "{{ lab_opt5_portgroup }}"
            # opt6: "{{ lab_opt6_portgroup }}"    
    dc:
      hosts:
        dc01:
          version: "Server2025eval"
          ip_address: 192.168.0.11
          extra_files_urls:
            - https://dl.google.com/chrome/install/googlechromestandaloneenterprise64.msi
            - http://the.earth.li/~sgtatham/putty/0.83/w64/putty-64bit-0.83-installer.msi
          extra_commands:
            - MsiExec.exe /i E:\files\putty-64bit-0.83-installer.msi /qn
            - MsiExec.exe /i E:\files\googlechromestandaloneenterprise64.msi /qn
  
