---
- name: "Install Requirements"
  hosts: localhost
  gather_facts: true
  tasks:
    
  - name: install python modules
    ansible.builtin.pip:
      name: "{{item}}"
    with_items:
      - pycdlib
      - pywinrm
      - pyvmomi
      - netapp-lib
      - jmespath
      - proxmoxer
      - passlib
      - "bcrypt<4.0.1"

  - name: install community.general
    ansible.builtin.command: ansible-galaxy collection install community.general

  - name: install remaining collections
    ansible.builtin.command: ansible-galaxy install -r requirements.yml

  - name: Detected package manager
    ansible.builtin.debug:
      msg: "This system uses: {{ ansible_pkg_mgr }}"
      
  - name: install packages
    ansible.builtin.command:
      cmd: "{{ ansible_pkg_mgr }} install -y {{item}}"
    become: True
    become_user: root
    ignore_errors: true
    with_items:
      - mtools
      - qemu-img
      - qemu-utils
      - xorriso

