---
- name: "Install Requirements"
  hosts: localhost
  gather_facts: true
  tasks:
    
  - name: install python modules
    ansible.builtin.pip:
      name: "{{item}}"
    with_items:
      - pycdlib
      - pywinrm
      - pyvmomi
      - netapp-lib
      - jmespath
      - proxmoxer
      - passlib
      - "bcrypt<4.0.1"
      - netaddr

  - name: install community.general
    ansible.builtin.command: ansible-galaxy collection install community.general

  - name: install remaining collections
    ansible.builtin.command: ansible-galaxy install -r requirements.yml

  - name: Detected package manager
    ansible.builtin.debug:
      msg: "This system uses: {{ ansible_facts['pkg_mgr'] }}"
      
  - name: install packages
    ansible.builtin.command:
      cmd: "{{ ansible_facts['pkg_mgr'] }} install -y {{item}}"
    become: True
    # become_user: root
    ignore_errors: true
    with_items:
      - mtools
      - qemu-img
      - xorriso
    when: ansible_facts['pkg_mgr'] == "dnf" or ansible_facts['pkg_mgr'] == "yum"

  - name: install packages
    ansible.builtin.command:
      cmd: "{{ ansible_facts['pkg_mgr'] }} install -y {{item}}"
    become: True
    # become_user: root
    ignore_errors: true
    with_items:
      - mtools
      - qemu-utils
      - xorriso
    when: ansible_facts['pkg_mgr'] == "apt"

  # This is a little underhanded, but the default 10 second timeout is very risky for the vcenter ova
  # OVA deployment is prone to timeouts, and this was the least bad option for fixing it
  # If this breaks the library in a future version, delete the patched version from the library folder
  - name: Locate system community.vmware vmware_deploy_ovf.py path
    ansible.builtin.command: >
      python3 -c "import ansible_collections.community.vmware.plugins.modules.vmware_deploy_ovf as m; print(m.__file__)"
    register: deploy_ovf_module_path
    changed_when: false
    delegate_to: localhost

  - name: Ensure local playbook library directory exists
    ansible.builtin.file:
      path: "{{ playbook_dir }}/library"
      state: directory
      mode: "0755"
    delegate_to: localhost

  - name: Copy vmware_deploy_ovf.py to local library directory
    ansible.builtin.copy:
      src: "{{ deploy_ovf_module_path.stdout | trim }}"
      dest: "{{ playbook_dir }}/library/vmware_deploy_ovf.py"
      remote_src: true
      force: false
      mode: "0644"
    delegate_to: localhost

  - name: Ensure open_url in local vmware_deploy_ovf.py uses a 600s socket timeout
    ansible.builtin.replace:
      path: "{{ playbook_dir }}/library/vmware_deploy_ovf.py"
      regexp: '(open_url\([^,\n]+,\s*)(?![^)]*timeout=)'
      replace: '\1timeout=600, '
    delegate_to: localhost