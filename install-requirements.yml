---
- name: "Install Requirements"
  hosts: localhost
  gather_facts: true
  tasks:
    
  - name: install python modules
    ansible.builtin.pip:
      name: "{{item}}"
    with_items:
      - pycdlib
      - pywinrm
      - pyvmomi
      - netapp-lib
      - jmespath
      - proxmoxer
      - passlib
      - "bcrypt<4.0.1"
      - netaddr
      - paramiko

  - name: install community.general
    ansible.builtin.command: ansible-galaxy collection install community.general

  - name: install remaining collections
    ansible.builtin.command: ansible-galaxy install -r requirements.yml

  - name: Detected package manager
    ansible.builtin.debug:
      msg: "This system uses: {{ ansible_facts['pkg_mgr'] }}"
      
  - name: install packages
    ansible.builtin.command:
      cmd: "{{ ansible_facts['pkg_mgr'] }} install -y {{item}}"
    become: True
    # become_user: root
    ignore_errors: true
    with_items:
      - curl
      - xorg-x11-server-Xvfb
      - mtools
      - qemu-img
      - xorriso
    when: ansible_facts['pkg_mgr'] == "dnf" or ansible_facts['pkg_mgr'] == "yum"

  - name: install packages
    ansible.builtin.command:
      cmd: "{{ ansible_facts['pkg_mgr'] }} install -y {{item}}"
    become: True
    # become_user: root
    ignore_errors: true
    with_items:
      - curl
      - xorg-x11-server-Xvfb
      - mtools
      - qemu-utils
      - xorriso
    when: ansible_facts['pkg_mgr'] == "apt"

#Install headless draw.io:
# RPM_URL=$(curl -s "https://api.github.com/repos/jgraph/drawio-desktop/releases/latest" | grep -oP '"browser_download_url":\s*"\K[^"]+x86_64[^"]+\.rpm')
# sudo dnf install -y "$RPM_URL"
  - name: Fetch latest draw.io Desktop release metadata
    ansible.builtin.uri:
      url: "https://{{ 'api.github' ~ '.com' }}/repos/jgraph/drawio-desktop/releases/latest"
      return_content: true
      headers:
        Accept: application/vnd.github+json
    register: drawio_release

  - name: Install draw.io Desktop x86_64 RPM
    ansible.builtin.command:
      argv:
        - dnf
        - install
        - -y
        - >-
          {{
            drawio_release.json.assets
            | selectattr('name', 'match', '^drawio-x86_64-.*\.rpm$')
            | map(attribute='browser_download_url')
            | first
          }}
    register: drawio_install
    changed_when: "'Nothing to do.' not in drawio_install.stdout"
    become: true

# This is a little underhanded, but the default 10 second timeout is very risky for the vcenter ova
# The OVA is prone to timeouts, and this was the least bad option for fixing it
  - name: Locate community.vmware vmware_deploy_ovf module
    ansible.builtin.shell: |
      set -o pipefail
      ansible-doc -t module -F community.vmware |
        awk '$1 == "community.vmware.vmware_deploy_ovf" { print $2 }'
    args:
      executable: /bin/bash
    register: deploy_ovf_module_path
    changed_when: false
    failed_when:
      - deploy_ovf_module_path.rc != 0
      - deploy_ovf_module_path.stdout | trim == ''
    delegate_to: localhost

  - name: Ensure local playbook library directory exists
    ansible.builtin.file:
      path: "{{ playbook_dir }}/library"
      state: directory
      mode: "0755"
    delegate_to: localhost

  - name: Copy vmware_deploy_ovf.py to local library directory
    ansible.builtin.copy:
      src: "{{ deploy_ovf_module_path.stdout | trim }}"
      dest: "{{ playbook_dir }}/library/vmware_deploy_ovf.py"
      remote_src: true
      force: false
      mode: "0644"
    delegate_to: localhost

  - name: Ensure open_url in local vmware_deploy_ovf.py uses a 600s socket timeout
    ansible.builtin.replace:
      path: "{{ playbook_dir }}/library/vmware_deploy_ovf.py"
      regexp: '(open_url\([^,\n]+,\s*)(?![^)]*timeout=)'
      replace: '\1timeout=600, '
    delegate_to: localhost